<style>
  :root {
    --bg: #FFFFFF;
    --card: #FFFFFF;
    --card-dim: #F2F4F6;
    --ink: #1F2328;
    --ink-soft: #6B7280;
    --glow1: transparent;
    --glow2: transparent;
    --saffron: #C98A2E;
    --herb: #4F7358;
    --clay: #B8451F;
    --teal: #2E7E82;
    --rose: #B85C7A;
    --mustard: #A67C1E;
    --plum: #6B4E9E;
    --line: rgba(15,23,42,0.10);
    --chalk-on-accent: #1F2328;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262922; --card: #33362D; --card-dim: #3C3F35;
      --glow1: color-mix(in srgb, var(--saffron) 10%, transparent); --glow2: color-mix(in srgb, var(--herb) 8%, transparent);
      --ink: #F5F0E6; --ink-soft: #B7B3A4; --saffron: #E3A857;
      --herb: #86AF90; --clay: #E08363; --teal: #5FB3B8; --rose: #E094AE; --mustard: #D9B24C; --plum: #A78BFA; --line: rgba(245,240,230,0.14);
    }
  }
  :root[data-theme="dark"] {
    --bg: #262922; --card: #33362D; --card-dim: #3C3F35;
    --glow1: color-mix(in srgb, var(--saffron) 10%, transparent); --glow2: color-mix(in srgb, var(--herb) 8%, transparent);
    --ink: #F5F0E6; --ink-soft: #B7B3A4; --saffron: #E3A857;
    --herb: #86AF90; --clay: #E08363; --teal: #5FB3B8; --rose: #E094AE; --mustard: #D9B24C; --plum: #A78BFA; --line: rgba(245,240,230,0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 15% 0%, var(--glow1), transparent 45%),
      radial-gradient(circle at 100% 30%, var(--glow2), transparent 50%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink); font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Fraunces', Georgia, serif; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 40px; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; color: var(--ink); }
  input:focus, textarea:focus, button:focus { outline: 2px solid var(--saffron); outline-offset: 1px; }
  img { max-width: 100%; display: block; }
  .field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; transition: border-color .15s ease; }
  .field:focus { border-color: var(--saffron); }
  .chip { border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; font-size: 13px; background: var(--card); color: var(--ink); white-space: nowrap; transition: all .15s ease; }
  .chip.active { background: var(--saffron); border-color: var(--saffron); color: var(--chalk-on-accent); box-shadow: 0 3px 10px color-mix(in srgb, var(--saffron) 45%, transparent); }
  .btn-primary { width: 100%; padding: 14px; border-radius: 12px; background: var(--saffron); color: var(--chalk-on-accent); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 18px color-mix(in srgb, var(--saffron) 40%, transparent); transition: transform .12s ease, box-shadow .12s ease; }
  .btn-primary:active { transform: scale(0.98); box-shadow: 0 3px 10px color-mix(in srgb, var(--saffron) 35%, transparent); }
  .btn-primary:disabled { opacity: .4; }
  .btn-ghost { width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; background: var(--card); }
  .icon-btn { padding: 8px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; }
  .card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .step-card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .row { display: flex; align-items: center; }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .banner.error { background: color-mix(in srgb, var(--clay) 18%, transparent); border: 1px solid var(--clay); }
  .banner.info { background: color-mix(in srgb, var(--herb) 18%, transparent); border: 1px solid var(--herb); }
  .fab { position: fixed; bottom: 24px; left: 50%; transform: translateX(calc(-50% + 190px)); display: flex; align-items: center; gap: 8px; padding: 15px 22px; border-radius: 999px; background: linear-gradient(135deg, var(--saffron), color-mix(in srgb, var(--saffron) 75%, #ff8a3d)); color: var(--chalk-on-accent); font-weight: 600; font-size: 14px; box-shadow: 0 10px 26px color-mix(in srgb, var(--saffron) 45%, transparent); transition: transform .12s ease; }
  .fab:active { transform: translateX(calc(-50% + 190px)) scale(0.96); }
  @media (max-width: 480px) { .fab { transform: none; right: 20px; left: auto; } .fab:active { transform: scale(0.96); } }
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
  .search-input { width: 100%; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14.5px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .search-input:focus { border-color: var(--saffron); }
  .recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .grid-card:active { transform: scale(0.97); }
  .grid-thumb { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--card-dim); display: flex; align-items: center; justify-content: center; }
  .grid-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cat-badge { position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: rgba(20,20,20,.55); backdrop-filter: blur(3px); font-size: 9.5px; font-weight: 600; letter-spacing: .03em; color: #fff; text-transform: uppercase; }
  .cat-dot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
  .grid-info { padding: 10px 11px 12px; }
  .grid-title { font-family: 'Fraunces', Georgia, serif; font-size: 14.5px; line-height: 1.25; margin: 0 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .grid-meta { font-size: 10.5px; color: var(--ink-soft); margin: 0; }

  /* side drawer */
  .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; animation: drawerFade .2s ease; }
  @keyframes drawerFade { from { opacity: 0 } to { opacity: 1 } }
  .drawer-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: 80%; max-width: 300px; z-index: 41;
    background: var(--card); box-shadow: 10px 0 30px rgba(0,0,0,.2);
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 0 24px;
    overflow-y: auto; animation: drawerSlide .22s ease;
  }
  @keyframes drawerSlide { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  .drawer-brand { display: flex; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .drawer-item { display: flex; align-items: center; gap: 13px; padding: 14px 20px; font-size: 14.5px; color: var(--ink); width: 100%; text-align: left; }
  .drawer-item:active { background: var(--card-dim); }
  .drawer-section-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); padding: 18px 20px 4px; font-weight: 600; }
  .drawer-cat-row { display: flex; align-items: center; gap: 10px; padding: 10px 20px 10px 38px; font-size: 13.5px; width: 100%; text-align: left; color: var(--ink); }
  .drawer-cat-row.active { font-weight: 600; }
  .drawer-cat-row:active { background: var(--card-dim); }
  .theme-toggle-row { display: flex; gap: 8px; padding: 6px 20px 4px; }
  .theme-opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 12px; border: 1px solid var(--line); font-size: 11px; color: var(--ink-soft); }
  .theme-opt.active { border-color: var(--saffron); color: var(--ink); background: var(--card-dim); }
  .active-filter-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 14px; }

  /* stories */
  .swipe-hint { position: fixed; left: 20px; bottom: 24px; z-index: 6; display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-radius: 999px; background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,.12); font-size: 13px; font-weight: 600; }
  .swipe-hint:active { transform: scale(0.96); }
  @media (max-width: 480px) { .swipe-hint { left: 20px; } }
  .story-tray { display: flex; gap: 14px; overflow-x: auto; padding: 4px 20px 6px; }
  .story-tray::-webkit-scrollbar { display: none; }
  .story-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; width: 68px; }
  .story-avatar-ring { width: 62px; height: 62px; border-radius: 999px; padding: 2.5px; background: linear-gradient(135deg, var(--saffron), var(--clay)); display: flex; align-items: center; justify-content: center; }

  .story-progress-row { display: flex; gap: 4px; padding: calc(env(safe-area-inset-top,0px) + 10px) 12px 0; }
  .story-progress-seg { flex: 1; height: 3px; border-radius: 999px; background: rgba(255,255,255,.3); overflow: hidden; }
  .story-progress-seg-fill { height: 100%; background: #fff; }
  .story-tap-zone { position: absolute; top: 0; bottom: 0; width: 40%; z-index: 2; }

  /* bottom tab bar */
  .bottom-tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-around; background: var(--card); border-top: 1px solid var(--line); padding: 9px 6px calc(env(safe-area-inset-bottom, 0px) + 8px); z-index: 15; box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-soft); font-size: 9.5px; padding: 4px 8px; }

  .tab-item-plus { width: 48px; height: 48px; border-radius: 999px; background: var(--saffron); color: var(--chalk-on-accent); display: flex; align-items: center; justify-content: center; margin-top: -24px; box-shadow: 0 6px 16px color-mix(in srgb, var(--saffron) 45%, transparent); }

  .profile-avatar-lg { width: 84px; height: 84px; border-radius: 999px; overflow: hidden; background: var(--card-dim); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 3px solid var(--card); box-shadow: 0 2px 10px rgba(0,0,0,.08); }

  .locked-box { text-align: center; padding: 50px 24px; color: var(--ink-soft); }
  .scroll-x { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .scroll-x::-webkit-scrollbar { display: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
  .ringing { animation: pulse 1s ease-in-out infinite; }
  .timer-ring-progress { transition: stroke-dashoffset 1s linear; }

  /* presentation mode */
  .pz-root { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column; }
  .pz-topbar { display: flex; align-items: center; justify-content: space-between; padding: env(safe-area-inset-top, 14px) 16px 10px; padding-top: calc(env(safe-area-inset-top, 0px) + 14px); gap: 10px; }
  .pz-progress { display: flex; gap: 4px; padding: 0 16px 10px; }
  .pz-progress-seg { flex: 1; height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .pz-progress-seg.done, .pz-progress-seg.current { background: var(--saffron); }
  .pz-body { flex: 1; overflow-y: auto; padding: 0 22px 24px; }
  .pz-navbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); border-top: 1px solid var(--line); background: var(--bg); }
  .pz-nav-btn { flex: 1; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .pz-nav-btn.next { background: var(--saffron); color: var(--chalk-on-accent); }
  .pz-nav-btn.back { background: var(--card); color: var(--ink); }
  .pz-nav-btn:disabled { opacity: .35; }
  .pz-stepnum { font-family: 'Fraunces', Georgia, serif; font-size: 15px; color: var(--herb); letter-spacing: .02em; }
  .pz-stepbig { font-family: 'Fraunces', Georgia, serif; font-size: 64px; line-height: 1; color: var(--saffron); opacity: .28; margin: 6px 0 -14px; }
  .pz-slide-in { animation: pzIn .28s ease; }
  @keyframes pzIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .pz-hero { width: 100%; border-radius: 16px; overflow: hidden; margin-bottom: 18px; background: var(--card-dim); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .pz-ring-jump { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); z-index: 20; background: var(--clay); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 600; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  .pz-center { text-align: center; display: flex; flex-direction: column; align-items: center; }
</style>

/* ---------------- calorie estimate ---------------- */
const UNIT_WEIGHT_G = {
  "uovo": 55, "uova": 55, "tuorlo d'uovo": 18, "albume d'uovo": 33,
  "mela": 150, "pesca": 130, "arancia": 150, "limone": 90, "lime": 50,
  "banana": 120, "cipolla": 110, "cipolla rossa": 110, "scalogno": 25,
  "pomodoro": 120, "pomodorino": 15, "patata": 150, "zucchina": 200,
  "carota": 70, "melanzana": 250, "peperone": 150, "spicchio d'aglio": 5,
  "aglio": 5, "mandarino": 60, "clementina": 60, "kiwi": 70, "avocado": 200,
  "fetta di pane": 30, "fetta": 30,
};
function parseGramsFromNote(note, canonicalName) {
  if (!note) return 0;
  const txt = note.toLowerCase().replace(",", ".");
  let m = txt.match(/(\d+(?:\.\d+)?)\s*(kg|chil)/);
  if (m) return parseFloat(m[1]) * 1000;
  m = txt.match(/(\d+(?:\.\d+)?)\s*(g|gr|grammi)\b/);
  if (m) return parseFloat(m[1]);
  m = txt.match(/(\d+(?:\.\d+)?)\s*(l|lt|litri)\b/);
  if (m) return parseFloat(m[1]) * 1000;
  m = txt.match(/(\d+(?:\.\d+)?)\s*(ml|cl)\b/);
  if (m) return parseFloat(m[1]) * (txt.includes("cl") ? 10 : 1);
  m = txt.match(/^(\d+(?:\.\d+)?)\b/);
  if (m) {
    const count = parseFloat(m[1]);
    const key = (canonicalName || "").toLowerCase();
    const unit = UNIT_WEIGHT_G[key] || 50;
    return count * unit;
  }
  return 0;
}
function estimateRecipeKcal(rec) {
  let total = 0, countedItems = 0, totalItems = 0;
  (rec.ingredients || []).forEach((ing) => {
    if (typeof ing === "string") return;
    totalItems++;
    const grams = parseGramsFromNote(ing.note, ing.name);
    if (grams <= 0) return;
    const per100 = ing.name && KCAL_PER_100G[ing.name] !== undefined ? KCAL_PER_100G[ing.name] : KCAL_DEFAULT;
    total += (grams / 100) * per100;
    countedItems++;
  });
  if (countedItems === 0) return null;
  return { total: Math.round(total), partial: countedItems < totalItems, countedItems, totalItems };
}
const FIT_THRESHOLD_PER_SERVING = 550;
function kcalPerServing(rec) {
  const est = estimateRecipeKcal(rec);
  if (!est) return null;
  const servings = rec.servings && rec.servings > 0 ? rec.servings : 4;
  return { perServing: Math.round(est.total / servings), total: est.total, partial: est.partial, servings };
}
function isFitRecipe(rec) {
  const k = kcalPerServing(rec);
  return k && !k.partial && k.perServing <= FIT_THRESHOLD_PER_SERVING;
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

/* compress an image file client-side into a small base64 JPEG (no external storage needed) */
function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 640; quality = quality || 0.6;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- alarm ---------------- */
const alarmIntervals = {};
let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.01);
}
function beepOnce() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine"; osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}
function startAlarm(id) {
  if (alarmIntervals[id]) return;
  beepOnce();
  alarmIntervals[id] = setInterval(beepOnce, 650);
}
function stopAlarm(id) {
  clearInterval(alarmIntervals[id]);
  delete alarmIntervals[id];
}

  const clickWrap = el("div", { style: { cursor: "pointer" }, onclick: () => { timers = {}; route = { screen: "detail", selectedId: r.id, step: -1 }; render(); } });
  const thumb = el("div", { class: "grid-thumb" });
  if (r.coverImage) thumb.appendChild(el("img", { src: r.coverImage, alt: r.name }));
  else thumb.innerHTML = ICONS.chef;
  if (cats.length && !r.exclusive) {
    const label = cats.length > 1 ? cats[0].label + " +" + (cats.length - 1) : cats[0].label;
    thumb.appendChild(el("div", { class: "cat-badge" }, [
      el("span", { class: "cat-dot", style: { background: "var(" + cats[0].color + ")" } }),
      label,
    ]));
  }
  if (r.exclusive) {
    thumb.appendChild(el("div", { class: "exclusive-badge" }, [el("span", { html: ICONS.lock }), "ESCLUSIVA"]));
  }
  if (isFitRecipe(r)) {
    thumb.appendChild(el("div", { class: "exclusive-badge", style: { left: "auto", right: "8px", top: "auto", bottom: "8px", background: "var(--herb)" } }, "FIT"));
  }
  const isFav = myFavorites.includes(r.id);
  const favBtn = el("button", {
    html: isFav ? ICONS.heartFilled : ICONS.heart,
    style: { position: "absolute", top: "8px", right: "8px", color: isFav ? "var(--clay)" : "#fff", background: "rgba(0,0,0,.4)", backdropFilter: "blur(3px)", borderRadius: "999px", padding: "6px" },
    onclick: (e) => { e.stopPropagation(); toggleFavorite(r.id); },
  });
  thumb.style.position = "relative";
  thumb.appendChild(favBtn);
  const votedBy = Array.isArray(r.votedBy) ? r.votedBy : [];
  const hasVoted = votedBy.includes(currentUid);
  const voteBtn = el("button", {
    class: "row", style: { gap: "4px", color: hasVoted ? "var(--saffron)" : "var(--ink-soft)", fontSize: "11px", fontWeight: 600 },
    onclick: (e) => { e.stopPropagation(); toggleVote(r); },
  }, [el("span", { html: hasVoted ? ICONS.thumbFilled : ICONS.thumb }), String(votedBy.length)]);
  const info = el("div", { class: "grid-info" }, [
    el("h3", { class: "grid-title" }, r.name),
    el("div", { class: "row", style: { justifyContent: "space-between", alignItems: "center" } }, [
      el("p", { class: "grid-meta" }, (r.steps || []).length + " passaggi"),
      voteBtn,
    ]),
  ]);
  clickWrap.append(thumb, info);
  card.appendChild(clickWrap);
  return card;
}

function openIngredientFilterSheet() {
  const existing = document.getElementById("ing-filter-sheet");
  if (existing) existing.remove();

  let tempSelection = [...ingredientFilter];
  const backdrop = el("div", { class: "drawer-backdrop", id: "ing-filter-sheet" });
  const panel = el("div", {
    style: { position: "fixed", left: "50%", bottom: "0", transform: "translateX(-50%)", width: "100%", maxWidth: "480px", maxHeight: "75vh", background: "var(--card)", borderRadius: "18px 18px 0 0", zIndex: "41", display: "flex", flexDirection: "column", boxShadow: "0 -10px 30px rgba(0,0,0,.2)" },
    onclick: (e) => e.stopPropagation(),
  });
  backdrop.addEventListener("click", () => backdrop.remove());

  panel.appendChild(el("div", { style: { padding: "18px 20px 10px" } }, [
    el("h3", { class: "display", style: { fontSize: "17px", margin: "0 0 12px" } }, "Filtra per ingredienti"),
  ]));

  const searchWrap = el("div", { class: "search-wrap", style: { margin: "0 20px 10px" } });
  searchWrap.innerHTML = ICONS.search;
  const q = el("input", { class: "search-input", placeholder: "Cerca ingrediente..." });
  searchWrap.appendChild(q);
  panel.appendChild(searchWrap);

  const list = el("div", { style: { overflowY: "auto", flex: "1", padding: "0 20px" } });
  panel.appendChild(list);

  function renderList() {
    list.innerHTML = "";
    const query = q.value.trim().toLowerCase();
    const items = MASTER_INGREDIENTS.filter((n) => !query || n.toLowerCase().includes(query));
    if (items.length === 0) {
      list.appendChild(el("p", { style: { fontSize: "12.5px", color: "var(--ink-soft)", padding: "10px 0" } }, "Nessun ingrediente trovato."));
      return;
    }
    items.forEach((name) => {
      const active = tempSelection.includes(name);
      const row = el("button", { class: "row", style: { justifyContent: "space-between", width: "100%", padding: "10px 2px", borderBottom: "1px solid var(--line)" } }, [
        el("span", { style: { fontSize: "13.5px", color: active ? "var(--saffron)" : "var(--ink)", fontWeight: active ? "600" : "400" } }, name),
        active ? el("span", { html: ICONS.check, style: { color: "var(--saffron)" } }) : el("span", {}),
      ]);
      row.addEventListener("click", () => {
        tempSelection = active ? tempSelection.filter((n) => n !== name) : [...tempSelection, name];
        renderList();
      });
      list.appendChild(row);
    });
  }
  q.addEventListener("input", renderList);
  renderList();

  const footer = el("div", { style: { padding: "12px 20px calc(env(safe-area-inset-bottom,0px) + 16px)", display: "flex", gap: "10px" } });
  const clearBtn = el("button", { class: "btn-ghost" }, "Azzera");
  clearBtn.addEventListener("click", () => { tempSelection = []; renderList(); });
  const applyBtn = el("button", { class: "btn-primary" }, "Applica");
  applyBtn.addEventListener("click", () => { ingredientFilter = tempSelection; backdrop.remove(); renderHome(); });
  footer.append(clearBtn, applyBtn);
  panel.appendChild(footer);

  backdrop.appendChild(panel);
  document.body.appendChild(backdrop);
}

    el("span", { html: ICONS.chef, style: { color: "var(--saffron)" } }),

  ]));

  const homeItem = el("button", { class: "drawer-item" }, [el("span", { html: ICONS.chef }), "Le tue ricette"]);

        c.label,
      ]);
      row.addEventListener("click", () => { filter = c.key; closeDrawer(); renderHome(); });
      panel.appendChild(row);
    });
  }

  if (AUTH_EMAIL === ADMIN_EMAIL) {
    const adminItem = el("button", { class: "drawer-item" }, [el("span", { html: ICONS.database }), "Backup ricette (admin)"]);
    adminItem.addEventListener("click", () => { closeDrawer(); route = { screen: "backup", selectedId: null }; render(); });
    panel.appendChild(adminItem);
  }

  panel.appendChild(el("div", { class: "drawer-section-title" }, "Tema"));
  const themeRow = el("div", { class: "theme-toggle-row" });
  const currentTheme = getTheme();
  const isDarkNow = currentTheme === "dark" || (currentTheme === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const lightOpt = el("button", { class: "theme-opt" + (!isDarkNow ? " active" : "") }, [el("span", { html: ICONS.sun }), "Chiaro"]);
  lightOpt.addEventListener("click", () => { try { localStorage.setItem("cucina_theme", "light"); } catch (e) {} applyTheme("light"); renderDrawer(); renderCurrent(); });
  const darkOpt = el("button", { class: "theme-opt" + (isDarkNow ? " active" : "") }, [el("span", { html: ICONS.moon }), "Scuro"]);
  darkOpt.addEventListener("click", () => { try { localStorage.setItem("cucina_theme", "dark"); } catch (e) {} applyTheme("dark"); renderDrawer(); renderCurrent(); });
  themeRow.append(lightOpt, darkOpt);
  panel.appendChild(themeRow);

  panel.appendChild(el("div", { class: "drawer-section-title" }, ""));
  const logoutItem = el("button", { class: "drawer-item", style: { color: "var(--ink-soft)" } }, [el("span", { html: ICONS.logout }), "Esci"]);
  logoutItem.addEventListener("click", () => {
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    closeDrawer();
    fauth.signOut();
  });
  panel.appendChild(logoutItem);

  backdrop.appendChild(panel);
  document.body.appendChild(backdrop);
}

function renderHome() {
  app.innerHTML = "";
  const stickyWrap = el("div", { style: { position: "sticky", top: "0", zIndex: "5", background: "var(--bg)", borderBottom: "1px solid var(--line)", paddingBottom: "12px" } });

  const topBar = el("div", { class: "row", style: { justifyContent: "space-between", padding: "22px 20px 4px" } });
  const menuBtn = el("button", { class: "icon-btn", html: ICONS.menu, style: { color: "var(--ink)" } });
  menuBtn.addEventListener("click", () => { drawerOpen = true; renderDrawer(); });
  topBar.append(
    menuBtn,
    el("div", { style: { textAlign: "right" } }, [
      el("p", { style: { fontSize: "12px", color: "var(--ink-soft)", margin: 0 } }, "Ciao, " + AUTH_USER),
      el("h1", { class: "display", style: { fontSize: "22px", margin: "2px 0 0" } }, "Le tue ricette"),

  );
  stickyWrap.appendChild(topBar);

  const searchRow = el("div", { style: { padding: "10px 20px 0" } });

  searchWrap.innerHTML = ICONS.search;
  const searchInput = el("input", { class: "search-input", placeholder: "Cerca una ricetta...", value: searchQuery });
  searchWrap.appendChild(searchInput);
  const ingFilterBtn = el("button", {
    class: "icon-btn", html: ICONS.filter,
    style: { background: ingredientFilter.length ? "var(--saffron)" : "var(--card)", color: ingredientFilter.length ? "var(--chalk-on-accent)" : "var(--ink)", border: "1px solid var(--line)", flexShrink: 0 },
  });
  ingFilterBtn.addEventListener("click", () => openIngredientFilterSheet());
  searchFlex.append(searchWrap, ingFilterBtn);
  searchRow.appendChild(searchFlex);

  if (filter !== "all") {
    const activeCat = CATEGORIES.find((c) => c.key === filter);
    if (activeCat) {
      const pill = el("button", { class: "active-filter-pill", style: { background: "var(" + activeCat.color + ")", color: "var(--chalk-on-accent)", marginTop: "10px", marginBottom: "0", marginRight: "6px" } }, [
        activeCat.label, el("span", { html: ICONS.x, style: { display: "flex" } }),
      ]);
      pill.addEventListener("click", () => { filter = "all"; renderHome(); });
      searchRow.appendChild(pill);
    }
  }
  ingredientFilter.forEach((name) => {
    const pill = el("button", { class: "active-filter-pill", style: { background: "var(--herb)", color: "#fff", marginTop: "10px", marginBottom: "0", marginRight: "6px" } }, [
      name, el("span", { html: ICONS.x, style: { display: "flex" } }),
    ]);
    pill.addEventListener("click", () => { ingredientFilter = ingredientFilter.filter((n) => n !== name); renderHome(); });
    searchRow.appendChild(pill);
  });
  stickyWrap.appendChild(searchRow);
  app.appendChild(stickyWrap);

  const body = el("div", { style: { padding: "14px 20px 90px" } });
  const bn = bannerNode();
  if (bn) body.appendChild(bn);

  const listContainer = el("div", {});
  body.appendChild(listContainer);
  app.appendChild(body);

  function renderRecipeList() {
    listContainer.innerHTML = "";
    let list = (filter === "all" ? recipes : recipes.filter((r) => catsOf(r).includes(filter))).filter((r) => !r.exclusive);
    const q = searchQuery.trim().toLowerCase();
    if (q) list = list.filter((r) => r.name.toLowerCase().includes(q));
    if (ingredientFilter.length) {
      const wanted = ingredientFilter.map((n) => n.toLowerCase());
      list = list.filter((r) => wanted.every((w) => (r.ingredientNames || []).includes(w)));
    }
    list = [...list].sort((a, b) => (Array.isArray(b.votedBy) ? b.votedBy.length : 0) - (Array.isArray(a.votedBy) ? a.votedBy.length : 0));

      ]));
    } else {
      const grid = el("div", { class: "recipe-grid" });
      list.forEach((r) => grid.appendChild(recipeCard(r)));
      listContainer.appendChild(grid);
    }
  }
  searchInput.addEventListener("input", (e) => { searchQuery = e.target.value; renderRecipeList(); });
  renderRecipeList();
  renderBottomTabBar("home");
}

/* ---------------- create ---------------- */
function renderCreate() {
  app.innerHTML = "";
  const wasEditing = !!editingRecipeId;
  app.appendChild(header({ title: wasEditing ? "Modifica ricetta" : "Nuova ricetta", back: true, onBack: () => {
    if (wasEditing) { const id = editingRecipeId; editingRecipeId = null; timers = {}; route = { screen: "detail", selectedId: id, step: -1 }; }
    else route = { screen: "home", selectedId: null };
    render();
  }}));
  const body = el("div", { style: { padding: "0 20px" } });

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "6px" } }, "Nome ricetta"));
  const nameInput = el("input", { class: "field", placeholder: "Es. Ragù della domenica", value: draft.name, style: { marginBottom: "16px" } });
  nameInput.addEventListener("input", (e) => { draft.name = e.target.value; updateSaveState(); });
  body.appendChild(nameInput);

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "8px" } }, "Categorie (puoi sceglierne più di una)"));
  const catRow = el("div", { class: "scroll-x", style: { marginBottom: "18px" } });
  CATEGORIES.forEach((c) => {
    const active = draft.categories.includes(c.key);
    const chip = el("button", { class: "chip" + (active ? " active" : "") }, c.label);
    if (active) { chip.style.background = "var(" + c.color + ")"; chip.style.borderColor = "var(" + c.color + ")"; }
    chip.addEventListener("click", () => {
      if (active) draft.categories = draft.categories.filter((k) => k !== c.key);
      else draft.categories = [...draft.categories, c.key];
      renderCreate();
    });
    catRow.appendChild(chip);
  });
  body.appendChild(catRow);

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "6px" } }, "Porzioni (per calcolare le kcal a porzione)"));
  const servingsInput = el("input", { class: "field", type: "text", inputmode: "numeric", value: draft.servings, style: { marginBottom: "18px", maxWidth: "100px" } });
  servingsInput.addEventListener("input", (e) => { if (/^\d{0,2}$/.test(e.target.value)) draft.servings = e.target.value; else e.target.value = draft.servings; });
  servingsInput.addEventListener("blur", () => { draft.servings = String(Math.max(1, parseInt(draft.servings, 10) || 4)); servingsInput.value = draft.servings; });
  body.appendChild(servingsInput);

  const myExclusiveCount = myExclusiveRecipes.filter((r) => r.id !== editingRecipeId).length;
  const exclusiveBox = el("div", { class: "step-card", style: { marginBottom: "20px" } });
  const exCheckboxLabel = el("label", { class: "row", style: { gap: "10px", fontSize: "13.5px", cursor: "pointer" } });
  const exCheckbox = el("input", { type: "checkbox" });
  exCheckbox.checked = draft.exclusive;
  const canBeExclusive = draft.exclusive || myExclusiveCount < MAX_EXCLUSIVE;
  if (!canBeExclusive) exCheckbox.disabled = true;
  exCheckbox.addEventListener("change", (e) => { draft.exclusive = e.target.checked; });
  exCheckboxLabel.append(exCheckbox, el("span", { html: ICONS.lock }), " Ricetta esclusiva (visibile solo a chi ti segue)");
  exclusiveBox.appendChild(exCheckboxLabel);
  exclusiveBox.appendChild(el("p", { style: { fontSize: "11px", color: canBeExclusive ? "var(--ink-soft)" : "var(--clay)", margin: "6px 0 0" } },
    canBeExclusive ? "Non comparirà nella pagina principale, solo nel tuo profilo. (" + myExclusiveCount + "/" + MAX_EXCLUSIVE + " usate)" : "Hai raggiunto il limite massimo di " + MAX_EXCLUSIVE + " ricette esclusive."));
  body.appendChild(exclusiveBox);

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "8px" } }, "Foto di presentazione"));
  const coverLabel = el("label", { class: "card", style: { width: "100%", height: "140px", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", marginBottom: "22px", overflow: "hidden" } });
  if (draft.coverImage) coverLabel.appendChild(el("img", { src: draft.coverImage, style: { width: "100%", height: "100%", objectFit: "cover" } }));
  else coverLabel.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-soft)">' + ICONS.image + '<span style="font-size:12px">Carica foto</span></div>';
  const coverInput = el("input", { type: "file", accept: "image/*", style: { display: "none" } });
  coverInput.addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    pendingWork++;
    compressImage(file, 640, 0.6).then((dataUrl) => { draft.coverImage = dataUrl; pendingWork--; renderCreate(); })
      .catch((err) => { pendingWork--; console.error(err); });
  });
  coverLabel.appendChild(coverInput);
  body.appendChild(coverLabel);

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "8px" } }, "Ingredienti"));
  const ingList = el("div", { id: "ing-list", style: { marginBottom: "24px" } });
  body.appendChild(ingList);
  renderIngredients(ingList);

  body.appendChild(el("h3", { class: "display", style: { fontSize: "17px", marginBottom: "10px" } }, "Passaggi"));
  const stepsList = el("div", { id: "steps-list" });
  body.appendChild(stepsList);
  renderSteps(stepsList);

  const addStepBtn = el("button", { class: "btn-ghost", style: { marginBottom: "22px" } }, [
    el("span", { html: ICONS.plus }), " Aggiungi passaggio"
  ]);
  addStepBtn.addEventListener("click", () => {
    draft.steps.push({ id: rid(), text: "", hasTimer: false, minutes: "5", seconds: "0", image: null });
    renderSteps(stepsList);
  });
  body.appendChild(addStepBtn);

  const saveBtn = el("button", { class: "btn-primary", id: "save-btn" }, [el("span", { html: ICONS.check }), wasEditing ? " Salva modifiche" : " Salva ricetta"]);
  saveBtn.addEventListener("click", saveRecipe);
  body.appendChild(saveBtn);
  body.appendChild(el("div", { style: { height: "20px" } }));

  app.appendChild(body);
  updateSaveState();
}

function renderIngredients(container) {
  container.innerHTML = "";
  draft.ingredients.forEach((item, idx) => {
    const row = el("div", { style: { marginBottom: "10px" } });
    const inputRow = el("div", { class: "row", style: { gap: "8px" } });

    const nameWrap = el("div", { style: { position: "relative", flex: 1 } });
    const nameInput = el("input", { class: "field", placeholder: "Scrivi per cercare...", value: item.name });
    const suggestBox = el("div", { style: { position: "absolute", left: 0, right: 0, top: "calc(100% + 4px)", background: "var(--card)", border: "1px solid var(--line)", borderRadius: "10px", boxShadow: "0 8px 20px rgba(0,0,0,.12)", zIndex: "6", maxHeight: "180px", overflowY: "auto", display: "none" } });
    const closeSuggest = () => { suggestBox.style.display = "none"; suggestBox.innerHTML = ""; };
    nameInput.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      item.name = e.target.value;
      if (!q) { closeSuggest(); return; }
      const matches = MASTER_INGREDIENTS.filter((n) => n.toLowerCase().includes(q)).slice(0, 8);
      if (matches.length === 0) { closeSuggest(); return; }
      suggestBox.innerHTML = "";
      matches.forEach((m) => {
        const opt = el("button", { style: { display: "block", width: "100%", textAlign: "left", padding: "9px 12px", fontSize: "13.5px", color: "var(--ink)" } }, m);
        opt.addEventListener("mousedown", (ev) => ev.preventDefault());
        opt.addEventListener("click", () => { item.name = m; nameInput.value = m; closeSuggest(); });
        suggestBox.appendChild(opt);
      });
      suggestBox.style.display = "block";
    });
    nameInput.addEventListener("blur", () => {
      setTimeout(() => {
        closeSuggest();
        if (item.name && !MASTER_INGREDIENTS.includes(item.name)) { item.name = ""; nameInput.value = ""; }
      }, 120);
    });
    nameWrap.append(nameInput, suggestBox);

    const noteInput = el("input", { class: "field", placeholder: "Quantità (facoltativa)", value: item.note || "", style: { maxWidth: "130px" } });
    noteInput.addEventListener("input", (e) => { item.note = e.target.value; });

    inputRow.append(nameWrap, noteInput);
    if (draft.ingredients.length > 1) {
      const rm = el("button", { class: "icon-btn", html: ICONS.trash, style: { color: "var(--ink-soft)" } });
      rm.addEventListener("click", () => { draft.ingredients.splice(idx, 1); renderIngredients(container); });
      inputRow.appendChild(rm);
    }
    row.appendChild(inputRow);
    container.appendChild(row);
  });
  const addBtn = el("button", { class: "btn-ghost" }, [el("span", { html: ICONS.plus }), " Aggiungi ingrediente"]);
  addBtn.addEventListener("click", () => { draft.ingredients.push({ name: "", note: "" }); renderIngredients(container); });
  container.appendChild(addBtn);
}

function renderSteps(container) {
  container.innerHTML = "";
  draft.steps.forEach((step, idx) => {
    const card = el("div", { class: "step-card" });
    const top = el("div", { class: "row", style: { justifyContent: "space-between", marginBottom: "8px" } }, [
      el("span", { style: { fontSize: "11.5px", fontWeight: 600, color: "var(--herb)" } }, "Passaggio " + (idx + 1)),
    ]);
    if (draft.steps.length > 1) {
      const rm = el("button", { html: ICONS.trash, style: { color: "var(--ink-soft)" } });
      rm.addEventListener("click", () => { draft.steps.splice(idx, 1); renderSteps(container); });
      top.appendChild(rm);
    }
    card.appendChild(top);

    const textArea = el("textarea", { class: "field", rows: "2", placeholder: "Descrivi cosa fare in questo passaggio...", style: { resize: "none", marginBottom: "10px" } });
    textArea.value = step.text;
    textArea.addEventListener("input", (e) => { step.text = e.target.value; updateSaveState(); });
    card.appendChild(textArea);

    const timerLabel = el("label", { class: "row", style: { gap: "8px", fontSize: "13.5px", marginBottom: "8px", cursor: "pointer" } });
    const cb = el("input", { type: "checkbox" });
    cb.checked = step.hasTimer;
    cb.addEventListener("change", (e) => { step.hasTimer = e.target.checked; renderSteps(container); });
    timerLabel.append(cb, "Aggiungi timer da cucina");
    card.appendChild(timerLabel);

    if (step.hasTimer) {
      const timeRow = el("div", { class: "row", style: { gap: "8px", marginBottom: "8px" } });
      const minInput = el("input", { class: "field", type: "text", inputmode: "numeric", style: { width: "60px", textAlign: "center", padding: "8px" }, value: step.minutes });
      minInput.addEventListener("input", (e) => { if (/^\d{0,3}$/.test(e.target.value)) step.minutes = e.target.value; else e.target.value = step.minutes; });
      minInput.addEventListener("blur", () => { step.minutes = String(Math.max(0, Math.min(180, parseInt(step.minutes, 10) || 0))); minInput.value = step.minutes; });
      const secInput = el("input", { class: "field", type: "text", inputmode: "numeric", style: { width: "60px", textAlign: "center", padding: "8px" }, value: step.seconds });
      secInput.addEventListener("input", (e) => { if (/^\d{0,2}$/.test(e.target.value)) step.seconds = e.target.value; else e.target.value = step.seconds; });
      secInput.addEventListener("blur", () => { step.seconds = String(Math.max(0, Math.min(59, parseInt(step.seconds, 10) || 0))); secInput.value = step.seconds; });
      timeRow.append(minInput, el("span", { style: { fontSize: "12px", color: "var(--ink-soft)" } }, "min"), secInput, el("span", { style: { fontSize: "12px", color: "var(--ink-soft)" } }, "sec"));
      card.appendChild(timeRow);
    }

    const photoLabel = el("label", { class: "row", style: { gap: "6px", fontSize: "12px", color: "var(--ink-soft)", cursor: "pointer" } });
    photoLabel.innerHTML = ICONS.image + '<span style="margin-left:4px">' + (step.image ? "Cambia foto" : "Aggiungi foto (opzionale)") + "</span>";
    const photoInput = el("input", { type: "file", accept: "image/*", style: { display: "none" } });
    photoInput.addEventListener("change", (e) => {
      const file = e.target.files[0]; if (!file) return;
      pendingWork++;
      compressImage(file, 480, 0.55).then((dataUrl) => { step.image = dataUrl; pendingWork--; renderSteps(container); })
        .catch((err) => { pendingWork--; console.error(err); });
    });
    photoLabel.appendChild(photoInput);
    card.appendChild(photoLabel);
    if (step.image) card.appendChild(el("img", { src: step.image, style: { width: "100%", height: "90px", objectFit: "cover", borderRadius: "8px", marginTop: "8px" } }));

    container.appendChild(card);
  });
}

function updateSaveState() {
  const btn = document.getElementById("save-btn");
  if (!btn) return;
  const ok = draft.name.trim() && draft.categories.length > 0 && draft.steps.every((s) => s.text.trim());
  btn.disabled = !ok;
}

function saveRecipe() {
  if (!draft.name.trim() || !draft.categories.length || !draft.steps.every((s) => s.text.trim())) return;
  if (!currentUid) { banner = { type: "error", text: "Connessione al database non pronta, riprova tra un istante." }; renderCreate(); return; }
  const isEditing = !!editingRecipeId;
  const original = isEditing ? getRecipeById(editingRecipeId) : null;
  const finish = () => {
    const data = {
      name: draft.name.trim(),
      categories: draft.categories,
      exclusive: !!draft.exclusive,
      servings: parseInt(draft.servings, 10) || 4,
      coverImage: draft.coverImage || null,
      ingredients: draft.ingredients.filter((i) => i.name.trim() || (i.note || "").trim()).map((i) => ({ name: i.name.trim(), note: (i.note || "").trim() })),
      ingredientNames: draft.ingredients.filter((i) => i.name.trim()).map((i) => i.name.trim().toLowerCase()),
      steps: draft.steps.map((s) => ({
        id: s.id, text: s.text.trim(), hasTimer: s.hasTimer,
        minutes: parseInt(s.minutes, 10) || 0, seconds: parseInt(s.seconds, 10) || 0,
        image: s.image || null,
      })),
      author: isEditing && original ? original.author : AUTH_USER,
      authorUid: isEditing && original ? original.authorUid : currentUid,
      createdAt: isEditing && original ? original.createdAt : Date.now(),
    };
    const ref = isEditing ? fdb.collection("recipes").doc(editingRecipeId) : fdb.collection("recipes").doc();
    ref.set(data).then(() => {
      const goToId = isEditing ? editingRecipeId : null;
      editingRecipeId = null;
      if (goToId) { timers = {}; route = { screen: "detail", selectedId: goToId, step: -1 }; }
      else route = { screen: "home", selectedId: null };
      render();
    }).catch((e) => {
      console.error(e);
      const msg = e.code === "invalid-argument" || (e.message && e.message.indexOf("1048576") > -1)
        ? "Ricetta troppo grande (troppe foto o foto troppo pesanti): riduci il numero di foto."
        : "Salvataggio non riuscito: " + e.code;
      banner = { type: "error", text: msg };
      renderCreate();
    });
  };
  if (pendingWork > 0) {
    const btn = document.getElementById("save-btn");
    if (btn) { btn.disabled = true; }
    const wait = setInterval(() => { if (pendingWork === 0) { clearInterval(wait); finish(); } }, 150);
  } else {
    finish();
  }
}

/* ---------------- detail ---------------- */
function stepTimerBlock(step) {
  const total = step.minutes * 60 + step.seconds;
  if (!timers[step.id]) timers[step.id] = { remaining: total, running: false, ringing: false, total };
  const t = timers[step.id];
  const r = 22, circumference = 2 * Math.PI * r;

  const wrap = el("div", { class: "row", style: { gap: "10px", marginTop: "10px", background: "var(--card-dim)", borderRadius: "10px", padding: "10px 12px" } });
  const ringWrap = el("div", { class: t.ringing ? "ringing" : "", style: { position: "relative", width: "48px", height: "48px", flexShrink: 0 } });
  ringWrap.innerHTML =
    '<svg width="48" height="48" viewBox="0 0 48 48">' +
    '<circle cx="24" cy="24" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="4"/>' +
    '<circle class="timer-ring-progress" data-ring="' + step.id + '" cx="24" cy="24" r="' + r + '" fill="none" stroke="' + (t.ringing ? "var(--clay)" : "var(--herb)") + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + (circumference * (1 - (total > 0 ? t.remaining / total : 0))) + '" transform="rotate(-90 24 24)"/></svg>' +
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:' + (t.ringing ? "var(--clay)" : "var(--ink)") + '">' + ICONS.alarm + "</div>";

  const mm = String(Math.floor(t.remaining / 60)).padStart(2, "0");
  const ss = String(t.remaining % 60).padStart(2, "0");
  const info = el("div", { style: { flex: 1 } }, [
    el("p", { id: "time-" + step.id, style: { fontSize: "14px", fontWeight: 600, margin: 0 } }, t.ringing ? "Tempo scaduto!" : (mm + ":" + ss)),
    el("p", { id: "status-" + step.id, style: { fontSize: "10.5px", color: "var(--ink-soft)", margin: 0 } }, t.ringing ? "Tocca per fermare la sveglia" : (t.running ? "In corso" : "Timer pronto")),
  ]);

  const controls = el("div", { class: "row", style: { gap: "6px" } });
  if (t.ringing) {
    const stopBtn = el("button", { class: "icon-btn", html: ICONS.x, style: { background: "var(--clay)", color: "#fff" } });
    stopBtn.addEventListener("click", () => { stopAlarm(step.id); t.ringing = false; refreshTimerNode(step); });
    controls.appendChild(stopBtn);
  } else {
    const resetBtn = el("button", { class: "icon-btn", html: ICONS.reset, style: { background: "var(--card)", color: "var(--ink)" } });
    resetBtn.addEventListener("click", () => { t.remaining = total; t.running = false; refreshTimerNode(step); });
    const playBtn = el("button", { class: "icon-btn", html: t.running ? ICONS.pause : ICONS.play, style: { background: "var(--herb)", color: "#fff" } });
    playBtn.addEventListener("click", () => { unlockAudio(); t.running = !t.running; refreshTimerNode(step); });
    controls.append(resetBtn, playBtn);
  }

  wrap.append(ringWrap, info, controls);
  wrap.setAttribute("data-timer-wrap", step.id);
  return wrap;
}

function refreshTimerNode(step) {
  const old = document.querySelector('[data-timer-wrap="' + step.id + '"]');
  if (!old) return;
  const fresh = stepTimerBlock(step);
  old.replaceWith(fresh);
}

let tickInterval = null;
function startTicking() {
  if (tickInterval) return;
  tickInterval = setInterval(() => {
    if (route.screen !== "detail") return;
    const rec = getRecipeById(route.selectedId);
    if (!rec) return;
    rec.steps.forEach((step) => {
      const t = timers[step.id];
      if (t && t.running && t.remaining > 0) {
        t.remaining -= 1;
        if (t.remaining === 0) { t.running = false; t.ringing = true; startAlarm(step.id); }
        const timeEl = document.getElementById("time-" + step.id);
        const statusEl = document.getElementById("status-" + step.id);
        const ring = document.querySelector('[data-ring="' + step.id + '"]');
        if (t.ringing) {
          refreshTimerNode(step);
        } else if (timeEl && statusEl) {
          const mm = String(Math.floor(t.remaining / 60)).padStart(2, "0");
          const ss = String(t.remaining % 60).padStart(2, "0");
          timeEl.textContent = mm + ":" + ss;
          if (ring) {
            const c = 2 * Math.PI * 22;
            ring.setAttribute("stroke-dashoffset", c * (1 - (t.total > 0 ? t.remaining / t.total : 0)));
          }
        }
      }
    });
  }, 1000);
}

function ringingStepInfo(rec) {
  for (let i = 0; i < rec.steps.length; i++) {
    if (timers[rec.steps[i].id]?.ringing) return { step: rec.steps[i], index: i };
  }
  return null;
}

function goToStep(newStep) {
  route.step = newStep;
  renderDetail();
}

function renderDetail() {
  startTicking();
  app.innerHTML = "";
  const rec = getRecipeById(route.selectedId);
  if (!rec) {
    app.appendChild(el("div", { style: { minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 30px", textAlign: "center" } }, [
      el("p", { style: { fontSize: "13px", marginBottom: "16px" } }, "Ricetta non trovata."),
      (() => { const b = el("button", { class: "btn-primary", style: { width: "auto", padding: "10px 20px" } }, "Torna alle ricette"); b.addEventListener("click", () => { route = { screen: "home", selectedId: null }; render(); }); return b; })(),
    ]));
    return;
  }
  const exitToHome = () => { route = { screen: "home", selectedId: null }; render(); };
  const ring = ringingStepInfo(rec);

  const root = el("div", { class: "pz-root" });

  if (ring && ring.index !== route.step) {
    const jump = el("button", { class: "pz-ring-jump ringing" }, "⏰ Timer scaduto — tocca per fermarlo");
    jump.addEventListener("click", () => goToStep(ring.index));
    root.appendChild(jump);
  }

  if (route.step === -1) {
    /* ---- overview / cover slide ---- */
    const top = el("div", { class: "pz-topbar" }, [
      el("button", { class: "icon-btn", html: ICONS.x, onclick: exitToHome }),
      el("div", {}),
    ]);
    root.appendChild(top);

    const body = el("div", { class: "pz-body pz-slide-in" });
    const cats = catsOf(rec).map((k) => CATEGORIES.find((c) => c.key === k)).filter(Boolean);
    const cover = el("div", { class: "pz-hero", style: { height: "220px", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" } });
    if (rec.coverImage) cover.appendChild(el("img", { src: rec.coverImage, style: { width: "100%", height: "100%", objectFit: "cover" } }));
    else cover.innerHTML = ICONS.chef;
    if ((rec.authorUid && rec.authorUid === currentUid) || AUTH_EMAIL === ADMIN_EMAIL) {
      const editBtn = el("button", {
        class: "icon-btn", html: ICONS.edit,
        style: { position: "absolute", top: "10px", right: "54px", color: "#fff", background: "rgba(0,0,0,.45)", backdropFilter: "blur(4px)" },
      });
      editBtn.addEventListener("click", () => {
        editingRecipeId = rec.id;
        draft = {
          name: rec.name, categories: catsOf(rec), coverImage: rec.coverImage || null, exclusive: !!rec.exclusive,
          servings: String(rec.servings || 4),
          ingredients: rec.ingredients && rec.ingredients.length
            ? rec.ingredients.map((i) => typeof i === "string" ? { name: "", note: i } : { name: i.name || "", note: i.note || "" })
            : [{ name: "", note: "" }],
          steps: rec.steps.map((s) => ({
            id: s.id, text: s.text, hasTimer: !!s.hasTimer,
            minutes: String(s.minutes || 0), seconds: String(s.seconds || 0), image: s.image || null,
          })),
        };
        route = { screen: "create", selectedId: null };
        render();
      });
      cover.appendChild(editBtn);

      let confirming = false, confirmTimeout = null;
      const del = el("button", {
        class: "icon-btn", html: ICONS.trash,
        style: { position: "absolute", top: "10px", right: "10px", color: "#fff", background: "rgba(0,0,0,.45)", backdropFilter: "blur(4px)" },
      });
      del.addEventListener("click", () => {
        if (!confirming) {
          confirming = true;
          del.innerHTML = ICONS.check;
          del.style.background = "var(--clay)";
          confirmTimeout = setTimeout(() => { confirming = false; del.innerHTML = ICONS.trash; del.style.background = "rgba(0,0,0,.45)"; }, 3000);
          return;
        }
        clearTimeout(confirmTimeout);
        fdb.collection("recipes").doc(rec.id).delete().catch((e) => console.error(e));
        recipes = recipes.filter((r) => r.id !== rec.id);
        delete exclusiveDocCache[rec.id];
        exitToHome();
      });
      cover.appendChild(del);
    }
    body.appendChild(cover);

    const titleBlock = el("div", { class: "pz-center", style: { marginBottom: "6px" } });
    const catPills = el("div", { class: "row", style: { gap: "6px", justifyContent: "center", flexWrap: "wrap" } });
    cats.forEach((c) => {
      catPills.appendChild(el("span", {
        style: { fontSize: "10px", fontWeight: 600, letterSpacing: ".03em", color: "var(" + c.color + ")", border: "1px solid var(" + c.color + ")", borderRadius: "999px", padding: "2px 9px" },
      }, c.label.toUpperCase()));
    });
    titleBlock.appendChild(catPills);
    titleBlock.appendChild(el("h1", { class: "display", style: { fontSize: "27px", margin: "6px 0 2px" } }, rec.name));
    body.appendChild(titleBlock);
    const authorLine = el("p", { style: { fontSize: "11.5px", color: "var(--ink-soft)", margin: "0 0 12px", textAlign: "center" } });
    const authorLink = el("button", { style: { color: "var(--ink-soft)", textDecoration: "underline", fontSize: "inherit" } }, rec.author);
    authorLink.addEventListener("click", () => { route = { screen: "profile", selectedId: null, viewUid: rec.authorUid }; render(); });
    authorLine.append("di ", authorLink, " · " + rec.steps.length + " passaggi");
    body.appendChild(authorLine);

    const isFavHere = myFavorites.includes(rec.id);
    const votedByHere = Array.isArray(rec.votedBy) ? rec.votedBy : [];
    const hasVotedHere = votedByHere.includes(currentUid);
    const actionsRow = el("div", { class: "row", style: { justifyContent: "center", gap: "10px", marginBottom: "22px" } });
    const favActionBtn = el("button", {
      class: "chip", style: { display: "flex", alignItems: "center", gap: "6px", color: isFavHere ? "var(--clay)" : "var(--ink)", borderColor: isFavHere ? "var(--clay)" : "var(--line)" },
    }, [el("span", { html: isFavHere ? ICONS.heartFilled : ICONS.heart }), isFavHere ? "Nei preferiti" : "Preferiti"]);
    favActionBtn.addEventListener("click", () => toggleFavorite(rec.id));
    const voteActionBtn = el("button", {
      class: "chip", style: { display: "flex", alignItems: "center", gap: "6px", color: hasVotedHere ? "var(--saffron)" : "var(--ink)", borderColor: hasVotedHere ? "var(--saffron)" : "var(--line)" },
    }, [el("span", { html: hasVotedHere ? ICONS.thumbFilled : ICONS.thumb }), String(votedByHere.length)]);
    voteActionBtn.addEventListener("click", () => toggleVote(rec));
    actionsRow.append(favActionBtn, voteActionBtn);
    body.appendChild(actionsRow);

    const kcalInfo = kcalPerServing(rec);
    if (kcalInfo) {
      const fit = !kcalInfo.partial && kcalInfo.perServing <= FIT_THRESHOLD_PER_SERVING;
      const kcalBox = el("div", { class: "row", style: { gap: "10px", padding: "12px 16px", borderRadius: "12px", background: fit ? "color-mix(in srgb, var(--herb) 14%, var(--card))" : "var(--card-dim)", marginBottom: "18px", border: "1px solid var(--line)" } });
      kcalBox.appendChild(el("div", { style: { fontFamily: "'Fraunces', Georgia, serif", fontSize: "20px", color: fit ? "var(--herb)" : "var(--ink)" } }, "~" + kcalInfo.perServing));
      const textCol = el("div", { style: { flex: 1 } });
      textCol.appendChild(el("p", { style: { fontSize: "12.5px", fontWeight: 600, margin: 0 } },
        "kcal a porzione" + (fit ? " · FIT" : "") + " (" + kcalInfo.servings + " porzioni, ~" + kcalInfo.total + " totali)"));
      textCol.appendChild(el("p", { style: { fontSize: "10.5px", color: "var(--ink-soft)", margin: "2px 0 0" } },
        kcalInfo.partial ? "Stima parziale: alcuni ingredienti non hanno un peso indicato." : "Stima approssimativa in base agli ingredienti."));
      kcalBox.appendChild(textCol);
      body.appendChild(kcalBox);
    }

    if (rec.ingredients && rec.ingredients.length) {
      const box = el("div", { class: "card", style: { padding: "14px 16px", marginBottom: "24px" } });
      box.appendChild(el("h3", { class: "display", style: { fontSize: "15px", margin: "0 0 8px" } }, "Ingredienti"));
      const ul = el("ul", { style: { margin: 0, padding: 0, listStyle: "none" } });
      rec.ingredients.forEach((ing) => {
        const label = typeof ing === "string" ? ing : [ing.note, ing.name].filter(Boolean).join(" · ") || ing.name;
        ul.appendChild(el("li", { class: "row", style: { gap: "8px", fontSize: "13.5px", padding: "3px 0" } }, [
          el("span", { style: { width: "4px", height: "4px", borderRadius: "999px", background: "var(--herb)", flexShrink: 0 } }),
          label,
        ]));
      });
      box.appendChild(ul);
      body.appendChild(box);
    }

    const startBtn = el("button", { class: "btn-primary", style: { padding: "16px" } }, [
      "Inizia ", el("span", { html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>' }),
    ]);
    startBtn.addEventListener("click", () => { unlockAudio(); goToStep(0); });
    body.appendChild(startBtn);
    root.appendChild(body);
    app.appendChild(root);
    return;
  }

  if (route.step >= rec.steps.length) {
    /* ---- completion slide ---- */
    const top = el("div", { class: "pz-topbar" }, [
      el("button", { class: "icon-btn", html: ICONS.x, onclick: exitToHome }),
      el("div", {}),
    ]);
    root.appendChild(top);
    const body = el("div", { class: "pz-body pz-slide-in", style: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", height: "100%" } });
    body.appendChild(el("div", { style: { fontSize: "52px", marginBottom: "10px" } }, "🎉"));
    body.appendChild(el("h1", { class: "display", style: { fontSize: "24px", margin: "0 0 6px" } }, "Ricetta completata!"));
    body.appendChild(el("p", { style: { fontSize: "13px", color: "var(--ink-soft)", marginBottom: "20px" } }, rec.name));
    const storyBtn = el("button", { class: "btn-primary", style: { marginBottom: "10px", maxWidth: "300px" } }, [el("span", { html: ICONS.camera }), " Crea una storia con la foto del tuo piatto"]);
    storyBtn.addEventListener("click", () => { route = { screen: "story-create", selectedId: rec.id }; render(); });
    const redo = el("button", { class: "btn-ghost", style: { marginBottom: "10px", maxWidth: "260px" } }, "Rivedi i passaggi");
    redo.addEventListener("click", () => goToStep(0));
    const home = el("button", { class: "btn-ghost", style: { maxWidth: "260px", color: "var(--ink-soft)" } }, "Torna alle ricette");
    home.addEventListener("click", exitToHome);
    body.append(storyBtn, redo, home);
    root.appendChild(body);
    app.appendChild(root);
    return;
  }

  /* ---- step slide ---- */
  const step = rec.steps[route.step];
  const top = el("div", { class: "pz-topbar" }, [
    el("button", { class: "icon-btn", html: ICONS.x, onclick: exitToHome }),
    el("span", { style: { fontSize: "12px", color: "var(--ink-soft)" } }, (route.step + 1) + " / " + rec.steps.length),
  ]);
  root.appendChild(top);

  const progress = el("div", { class: "pz-progress" });
  rec.steps.forEach((s, i) => {
    progress.appendChild(el("div", { class: "pz-progress-seg" + (i < route.step ? " done" : i === route.step ? " current" : "") }));
  });
  root.appendChild(progress);

  const body = el("div", { class: "pz-body pz-slide-in pz-center" });
  if (step.image) body.appendChild(el("div", { class: "pz-hero", style: { height: "200px", width: "100%" } }, [
    el("img", { src: step.image, style: { width: "100%", height: "100%", objectFit: "cover" } }),
  ]));
  body.appendChild(el("div", { class: "pz-stepbig" }, String(route.step + 1).padStart(2, "0")));
  body.appendChild(el("p", { class: "pz-stepnum" }, "Passaggio " + (route.step + 1)));
  body.appendChild(el("p", { style: { fontSize: "19px", lineHeight: "1.6", margin: "8px 0 4px", maxWidth: "360px" } }, step.text));
  if (step.hasTimer) body.appendChild(stepTimerBlock(step));
  root.appendChild(body);

  const navbar = el("div", { class: "pz-navbar" });
  const backBtn = el("button", { class: "pz-nav-btn back" }, "Indietro");
  backBtn.addEventListener("click", () => goToStep(route.step - 1));
  const nextBtn = el("button", { class: "pz-nav-btn next" }, route.step === rec.steps.length - 1 ? "Fine" : "Avanti");
  nextBtn.addEventListener("click", () => goToStep(route.step + 1));
  navbar.append(backBtn, nextBtn);
  root.appendChild(navbar);

  app.appendChild(root);
}

function renderProfile() {
  app.innerHTML = "";
  const uid = route.viewUid || currentUid;
  const isMe = uid === currentUid;

  const stickyWrap = el("div", { style: { position: "sticky", top: "0", zIndex: "5", background: "var(--bg)", borderBottom: "1px solid var(--line)", paddingBottom: "10px" } });

    ? el("div", { style: { width: "22px" } })

    searchRow.appendChild(searchWrap);
    const resultsBox = el("div", { style: { marginTop: "8px" } });
    searchRow.appendChild(resultsBox);
    stickyWrap.appendChild(searchRow);

    let allProfiles = null;
    userSearchInput.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      resultsBox.innerHTML = "";
      if (!q) return;
      const renderResults = () => {
        const matches = allProfiles.filter((p) => p.id !== currentUid && (p.displayName || "").toLowerCase().includes(q)).slice(0, 12);
        if (matches.length === 0) {
          resultsBox.appendChild(el("p", { style: { fontSize: "12px", color: "var(--ink-soft)", padding: "8px 2px" } }, "Nessun utente trovato."));
          return;
        }
        matches.forEach((p) => {
          const row = el("button", { class: "row", style: { gap: "10px", padding: "8px 2px", width: "100%" } });
          const av = el("div", { style: { width: "32px", height: "32px", borderRadius: "999px", overflow: "hidden", flexShrink: 0, background: "var(--card-dim)", display: "flex", alignItems: "center", justifyContent: "center" } });
          if (p.photoURL) av.appendChild(el("img", { src: p.photoURL, style: { width: "100%", height: "100%", objectFit: "cover" } }));
          else av.innerHTML = ICONS.chef;
          row.append(av, el("span", { style: { fontSize: "13.5px" } }, p.displayName || "Utente"));
          row.addEventListener("click", () => { route = { screen: "profile", selectedId: null, viewUid: p.id }; render(); });
          resultsBox.appendChild(row);
        });
      };
      if (allProfiles) { renderResults(); return; }
      resultsBox.appendChild(el("p", { style: { fontSize: "12px", color: "var(--ink-soft)", padding: "8px 2px" } }, "Cerco…"));
      fdb.collection("profiles").limit(300).get().then((snap) => {
        allProfiles = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        resultsBox.innerHTML = "";
        renderResults();
      }).catch((err) => {
        console.error(err);
        resultsBox.innerHTML = "";
        resultsBox.appendChild(el("p", { style: { fontSize: "12px", color: "var(--clay)", padding: "8px 2px" } }, "Ricerca non riuscita."));
      });
    });
  }

  app.appendChild(stickyWrap);

  const body = el("div", { style: { padding: "10px 20px 90px" } });
  const loadingP = el("p", { style: { fontSize: "12px", color: "var(--ink-soft)", textAlign: "center", padding: "40px 0" } }, "Caricamento…");
  body.appendChild(loadingP);
  app.appendChild(body);

  fetchProfile(uid, (profile) => {
    body.innerHTML = "";

    const head = el("div", { class: "row", style: { gap: "16px", marginBottom: "16px" } });
    const avatarWrap = el("div", { class: "profile-avatar-lg" });
    if (profile.photoURL) avatarWrap.appendChild(el("img", { src: profile.photoURL }));
    else avatarWrap.innerHTML = ICONS.chef;
    head.appendChild(avatarWrap);

    const statsRow = el("div", { class: "row", style: { flex: 1 } });
    const recipesStat = el("div", { class: "profile-stat" }, [el("b", { id: "exclusive-count" }, isMe ? String(myExclusiveRecipes.length) : "…"), el("span", {}, "Esclusive")]);
    const followersStat = el("button", { class: "profile-stat" }, [el("b", { id: "followers-count" }, "…"), el("span", {}, "Follower")]);
    followersStat.addEventListener("click", () => { route = { screen: "follow-list", selectedId: null, viewUid: uid, listMode: "followers" }; render(); });
    const followingStat = el("button", { class: "profile-stat" }, [el("b", { id: "following-count" }, "…"), el("span", {}, "Seguiti")]);
    followingStat.addEventListener("click", () => { route = { screen: "follow-list", selectedId: null, viewUid: uid, listMode: "following" }; render(); });
    statsRow.append(recipesStat, followersStat, followingStat);
    head.appendChild(statsRow);
    body.appendChild(head);

    countFollowers(uid, (n) => { const elx = document.getElementById("followers-count"); if (elx) elx.textContent = n; });
    countFollowing(uid, (n) => { const elx = document.getElementById("following-count"); if (elx) elx.textContent = n; });

    body.appendChild(el("h3", { class: "display", style: { fontSize: "19px", margin: "0 0 14px" } }, profile.displayName));

    if (isMe) {
      const editBtn = el("button", { class: "btn-ghost", style: { marginBottom: "22px" } }, "Modifica profilo");
      editBtn.addEventListener("click", () => { route = { screen: "profile-edit", selectedId: null }; render(); });
      body.appendChild(editBtn);
    } else {
      const following = myFollowing.includes(uid);
      const followBtn = el("button", { class: following ? "btn-ghost" : "btn-primary", style: { marginBottom: "22px" } }, following ? "Segui già ✓" : "Segui");
      followBtn.addEventListener("click", () => { toggleFollow(uid); setTimeout(() => renderProfile(), 150); });
      body.appendChild(followBtn);
    }

    body.appendChild(el("h3", { class: "display", style: { fontSize: "16px", margin: "0 0 12px" } }, isMe ? "Le tue ricette esclusive" : "Ricette esclusive"));

    const canSee = isMe || myFollowing.includes(uid) || AUTH_EMAIL === ADMIN_EMAIL;
    if (!canSee) {
      body.appendChild(el("div", { class: "locked-box" }, [
        el("div", { html: ICONS.lock, style: { display: "flex", justifyContent: "center", marginBottom: "8px" } }),
        el("p", { style: { fontSize: "13px" } }, "Segui " + profile.displayName + " per vedere le sue ricette esclusive."),
      ]));
    } else if (isMe) {
      renderExclusiveGrid(body, myExclusiveRecipes, true);
    } else {
      const loadingEx = el("p", { style: { fontSize: "12.5px", color: "var(--ink-soft)" } }, "Caricamento…");
      body.appendChild(loadingEx);
      fetchExclusiveFor(uid, (list) => {
        loadingEx.remove();
        const countEl = document.getElementById("exclusive-count");
        if (countEl) countEl.textContent = list.length;
        renderExclusiveGrid(body, list, false);
      });
    }
  });

  renderBottomTabBar(isMe ? "profile" : null);
}
