/* ---------------- backup / bulk import (admin) ---------------- */
function downloadJSON(filename, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename, style: { display: "none" } });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}

function renderBackup() {
  app.innerHTML = "";
  app.appendChild(header({ title: "Backup ricette", back: true, onBack: () => { route = { screen: "home", selectedId: null }; render(); } }));
  const body = el("div", { style: { padding: "0 20px 90px" } });
  const bn = bannerNode();
  if (bn) body.appendChild(bn);

  body.appendChild(el("h3", { class: "display", style: { fontSize: "16px", margin: "4px 0 8px", color: "var(--clay)" } }, "Zona pericolosa"));
  body.appendChild(el("p", { style: { fontSize: "12.5px", color: "var(--ink-soft)", marginBottom: "10px" } },
    "Elimina tutte le ricette di tutti gli utenti. Non è reversibile — fai prima un'esportazione se vuoi una copia."));
  const wipeStatus = el("p", { style: { fontSize: "12px", color: "var(--herb)", marginBottom: "8px" } });
  let wipeConfirming = false, wipeConfirmTimeout = null;
  const wipeBtn = el("button", { class: "btn-ghost", style: { marginBottom: "26px", color: "var(--clay)", borderColor: "var(--clay)" } }, "Elimina TUTTE le ricette");
  wipeBtn.addEventListener("click", () => {
    if (!wipeConfirming) {
      wipeConfirming = true;
      wipeBtn.textContent = "Tocca di nuovo per confermare";
      wipeConfirmTimeout = setTimeout(() => { wipeConfirming = false; wipeBtn.textContent = "Elimina TUTTE le ricette"; }, 4000);
      return;
    }
    clearTimeout(wipeConfirmTimeout);
    wipeBtn.disabled = true;
    wipeStatus.textContent = "Eliminazione in corso…";
    fdb.collection("recipes").limit(300).get().then((snap) => {
      let done = 0;
      const delNext = (i) => {
        if (i >= snap.docs.length) { wipeStatus.textContent = "Eliminate " + done + " ricette."; wipeBtn.disabled = false; wipeBtn.textContent = "Elimina TUTTE le ricette"; return; }
        snap.docs[i].ref.delete().then(() => { done++; delNext(i + 1); }).catch(() => delNext(i + 1));
      };
      delNext(0);
    }).catch((e) => {
      console.error(e);
      wipeStatus.style.color = "var(--clay)";
      wipeStatus.textContent = "Eliminazione non riuscita: " + e.code;
      wipeBtn.disabled = false;
    });
  });
  body.append(wipeStatus, wipeBtn);

  body.appendChild(el("h3", { class: "display", style: { fontSize: "16px", margin: "4px 0 8px" } }, "Riparazione dati"));
  body.appendChild(el("p", { style: { fontSize: "12.5px", color: "var(--ink-soft)", marginBottom: "12px" } },
    "Le ricette create prima di oggi non hanno il campo \"esclusiva\": questo le nasconde. Premi una volta per sistemarle tutte (solo la prima volta, dopo non serve più)."));
  const repairStatus = el("p", { style: { fontSize: "12px", color: "var(--herb)", marginBottom: "8px" } });
  const repairBtn = el("button", { class: "btn-ghost", style: { marginBottom: "26px" } }, "Ripara ricette esistenti");
  repairBtn.addEventListener("click", () => {
    repairBtn.disabled = true;
    repairStatus.textContent = "Controllo in corso…";
    fdb.collection("recipes").limit(300).get().then((snap) => {
      const missing = snap.docs.filter((d) => d.data().exclusive === undefined);
      if (missing.length === 0) { repairStatus.textContent = "Tutto già a posto, nessuna ricetta da riparare."; repairBtn.disabled = false; return; }
      let done = 0;
      const fixNext = (i) => {
        if (i >= missing.length) { repairStatus.textContent = "Fatto: " + done + " ricette riparate."; repairBtn.disabled = false; return; }
        missing[i].ref.update({ exclusive: false }).then(() => { done++; fixNext(i + 1); }).catch(() => fixNext(i + 1));
      };
      fixNext(0);
    }).catch((e) => {
      console.error(e);
      repairStatus.style.color = "var(--clay)";
      repairStatus.textContent = "Riparazione non riuscita: " + e.code;
      repairBtn.disabled = false;
    });
  });
  body.append(repairStatus, repairBtn);

  body.appendChild(el("h3", { class: "display", style: { fontSize: "16px", margin: "4px 0 8px" } }, "Esporta"));
  body.appendChild(el("p", { style: { fontSize: "12.5px", color: "var(--ink-soft)", marginBottom: "12px" } },
    "Scarica tutte le ricette attuali (" + recipes.length + ") in un file JSON, da tenere come copia di sicurezza."));
  const exportBtn = el("button", { class: "btn-ghost", style: { marginBottom: "26px" } }, [el("span", { html: ICONS.download }), " Esporta backup (JSON)"]);
  exportBtn.addEventListener("click", () => {
    downloadJSON("cucina-backup-" + new Date().toISOString().slice(0, 10) + ".json", recipes);
  });
  body.appendChild(exportBtn);

  body.appendChild(el("h3", { class: "display", style: { fontSize: "16px", margin: "4px 0 8px" } }, "Importa in blocco"));
  body.appendChild(el("p", { style: { fontSize: "12.5px", color: "var(--ink-soft)", marginBottom: "12px" } },
    "Carica un file JSON con un elenco di ricette (un backup esportato, o un file preparato apposta) per aggiungerle tutte insieme al database."));

  const status = el("p", { style: { fontSize: "12.5px", color: "var(--herb)", marginBottom: "10px" } });
  const fileLabel = el("label", { class: "btn-ghost", style: { marginBottom: "8px" } }, [el("span", { html: ICONS.upload }), " Scegli file JSON"]);
  const fileInput = el("input", { type: "file", accept: "application/json,.json", style: { display: "none" } });
  let pendingImport = null;
  const confirmBtn = el("button", { class: "btn-primary", style: { display: "none" } }, "Conferma importazione");

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.recipes) ? parsed.recipes : null);
        if (!list || !list.length) throw new Error("Il file non contiene un elenco di ricette valido.");
        const bad = list.find((r) => !r.name || !Array.isArray(r.steps) || !r.steps.length);
        if (bad) throw new Error("Ogni ricetta deve avere almeno \"name\" e \"steps\".");
        pendingImport = list;
        status.style.color = "var(--herb)";
        status.textContent = "Pronto: " + list.length + " ricette nel file.";
        confirmBtn.textContent = "Importa " + list.length + " ricette";
        confirmBtn.style.display = "flex";
      } catch (err) {
        pendingImport = null;
        confirmBtn.style.display = "none";
        status.style.color = "var(--clay)";
        status.textContent = "File non valido: " + err.message;
      }
    };
    reader.readAsText(file);
  });
  fileLabel.appendChild(fileInput);
  body.append(fileLabel, status, confirmBtn);

  confirmBtn.addEventListener("click", () => {
    if (!pendingImport) return;
    confirmBtn.disabled = true;
    confirmBtn.textContent = "Importazione in corso…";
    const items = pendingImport;
    let done = 0, failed = 0;
    const now = Date.now();
    const writeNext = (i) => {
      if (i >= items.length) {
        status.style.color = failed ? "var(--clay)" : "var(--herb)";
        status.textContent = "Fatto: " + done + " importate" + (failed ? ", " + failed + " fallite." : ".");
        confirmBtn.style.display = "none";
        pendingImport = null;
        return;
      }
      const r = items[i];
      const hasId = !!r.id;
      const rawCats = Array.isArray(r.categories) ? r.categories : (r.category ? [r.category] : []);
      const validCats = rawCats.filter((k) => CATEGORIES.some((c) => c.key === k));
      const normIngredients = Array.isArray(r.ingredients) ? r.ingredients.map((i) => typeof i === "string" ? { name: "", note: i } : { name: i.name || "", note: i.note || "" }) : [];
      const ingredientNames = normIngredients.filter((i) => i.name).map((i) => i.name.toLowerCase());
      const data = {
        name: r.name,
        categories: validCats.length ? validCats : [CATEGORIES[0].key],
        exclusive: !!r.exclusive,
        coverImage: r.coverImage || null,
        ingredients: normIngredients,
        ingredientNames: ingredientNames,
        steps: r.steps.map((s) => ({
          id: s.id || rid(), text: s.text || "", hasTimer: !!s.hasTimer,
          minutes: Number(s.minutes) || 0, seconds: Number(s.seconds) || 0, image: s.image || null,
        })),
        author: hasId && r.author ? r.author : AUTH_USER,
        authorUid: hasId && r.authorUid ? r.authorUid : currentUid,
        createdAt: hasId && r.createdAt ? r.createdAt : now + i,
      };
      const ref = hasId ? fdb.collection("recipes").doc(r.id) : fdb.collection("recipes").doc();
      ref.set(data).then(() => { done++; writeNext(i + 1); }).catch((e) => { console.error(e); failed++; writeNext(i + 1); });
    };
    writeNext(0);
  });

  app.appendChild(body);
  renderBottomTabBar(null);
}

/* ---------------- boot ---------------- */
function render() {
  const tb0 = document.getElementById("bottom-tabbar"); if (tb0) tb0.remove();
  if (route.screen === "login") renderLogin();
  else if (route.screen === "create") renderCreate();
  else if (route.screen === "detail") renderDetail();
  else if (route.screen === "backup") renderBackup();
  else if (route.screen === "favorites") renderFavorites();
  else if (route.screen === "profile") renderProfile();
  else if (route.screen === "profile-edit") renderProfileEdit();
  else if (route.screen === "follow-list") renderFollowList();
  else if (route.screen === "stories") renderStories();
  else if (route.screen === "story-create") renderStoryCreate();
  else renderHome();
}
function attachSwipeNav() {
  let startX = 0, startY = 0, tracking = false;
  document.addEventListener("touchstart", (e) => {
    if (drawerOpen) { tracking = false; return; }
    if (!(route.screen === "home" || route.screen === "stories")) { tracking = false; return; }
    const t = e.touches[0]; startX = t.clientX; startY = t.clientY; tracking = true;
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      if (dx < 0 && route.screen === "home") { route = { screen: "stories", selectedId: null }; render(); }
      else if (dx > 0 && route.screen === "stories") { route = { screen: "home", selectedId: null }; render(); }
    }
  }, { passive: true });
}
attachSwipeNav();
render();
initFirebase();
</script>
</body>
</html>
