<style>
  :root {
    --bg: #F5F0E6;
    --card: #FFFFFF;
    --card-dim: #EFE9DA;
    --ink: #2B2E27;
    --ink-soft: #6B6F63;
    --saffron: #C98A2E;
    --herb: #4F7358;
    --clay: #B8451F;
    --line: rgba(43,46,39,0.14);
    --chalk-on-accent: #2B2E27;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262922; --card: #33362D; --card-dim: #3C3F35;
      --ink: #F5F0E6; --ink-soft: #B7B3A4; --saffron: #E3A857;
      --herb: #86AF90; --clay: #E08363; --line: rgba(245,240,230,0.14);
    }
  }
  :root[data-theme="dark"] {
    --bg: #262922; --card: #33362D; --card-dim: #3C3F35;
    --ink: #F5F0E6; --ink-soft: #B7B3A4; --saffron: #E3A857;
    --herb: #86AF90; --clay: #E08363; --line: rgba(245,240,230,0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .display { font-family: 'Fraunces', Georgia, serif; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 40px; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; color: var(--ink); }
  input:focus, textarea:focus, button:focus { outline: 2px solid var(--saffron); outline-offset: 1px; }
  img { max-width: 100%; display: block; }
  .field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; }
  .chip { border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; font-size: 13px; background: transparent; color: var(--ink); white-space: nowrap; }
  .chip.active { background: var(--saffron); border-color: var(--saffron); color: var(--chalk-on-accent); }
  .btn-primary { width: 100%; padding: 13px; border-radius: 10px; background: var(--saffron); color: var(--chalk-on-accent); font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary:disabled { opacity: .4; }
  .btn-ghost { width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; background: var(--card); }
  .icon-btn { padding: 8px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; }
  .step-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 12.5px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .banner.error { background: color-mix(in srgb, var(--clay) 18%, transparent); border: 1px solid var(--clay); }
  .banner.info { background: color-mix(in srgb, var(--herb) 18%, transparent); border: 1px solid var(--herb); }
  .fab { position: fixed; bottom: 24px; left: 50%; transform: translateX(calc(-50% + 190px)); width: 56px; height: 56px; border-radius: 999px; background: var(--saffron); color: var(--chalk-on-accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
  @media (max-width: 480px) { .fab { transform: none; right: 20px; left: auto; } }
  .scroll-x { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .scroll-x::-webkit-scrollbar { display: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }
  .ringing { animation: pulse 1s ease-in-out infinite; }
  .timer-ring-progress { transition: stroke-dashoffset 1s linear; }
</style>

<script>
/* ---------------- firebase ---------------- */
const firebaseConfig = {

let currentUid = null;

/* ---------------- utilities ---------------- */
const ICONS = {
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  chef: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" y1="17" x2="18" y2="17"/></svg>',
  clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  play: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  pause: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>',
  reset: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  image: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
  logout: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  alarm: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="M22 6 19 3"/></svg>',
};

const CATEGORIES = [
  { key: "antipasti", label: "Antipasti" },
  { key: "primi", label: "Primi" },
  { key: "secondi", label: "Secondi" },
  { key: "contorni", label: "Contorni" },
];

function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

/* compress an image file client-side into a small base64 JPEG (no external storage needed) */
function compressImage(file, maxDim, quality) {
  maxDim = maxDim || 640; quality = quality || 0.6;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- alarm ---------------- */
const alarmIntervals = {};
let audioCtx = null;
function beepOnce() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine"; osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}
function startAlarm(id) {
  if (alarmIntervals[id]) return;
  beepOnce();
  alarmIntervals[id] = setInterval(beepOnce, 650);
}
function stopAlarm(id) {
  clearInterval(alarmIntervals[id]);
  delete alarmIntervals[id];
}

/* ---------------- state ---------------- */
let AUTH_USER = null;
let AUTH_PHOTO = null;
let recipes = [];
let route = { screen: "login", selectedId: null };
let filter = "all";
let banner = null;
let draft = null;
let timers = {};
let pendingWork = 0;

const app = document.getElementById("app");

/* ---------------- persistence ---------------- */
function initFirebase() {
  fauth.getRedirectResult().catch((e) => {
    console.error("redirect sign-in failed", e);
    banner = { type: "error", text: "Accesso con Google non riuscito (" + e.code + ")." };
    renderCurrent();
  });
  fauth.onAuthStateChanged((user) => {
    if (user) {
      currentUid = user.uid;
      AUTH_USER = user.displayName || user.email || "Utente";
      AUTH_PHOTO = user.photoURL || null;
      if (route.screen === "login") route = { screen: "home", selectedId: null };
      subscribeRecipes();
      render();
    } else {
      currentUid = null;
      AUTH_USER = null;
      AUTH_PHOTO = null;
      route = { screen: "login", selectedId: null };
      render();
    }
  });
}

function subscribeRecipes() {
  fdb.collection("recipes").orderBy("createdAt", "desc").limit(200).onSnapshot(
    (snap) => {
      recipes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (route.screen === "home") renderHome();
      if (route.screen === "detail") {
        const still = recipes.find((r) => r.id === route.selectedId);
        if (!still) { route = { screen: "home", selectedId: null }; render(); }
      }
    },
    (err) => {
      console.error("firestore onSnapshot error", err);
      banner = { type: "error", text: "Sincronizzazione interrotta (" + err.code + ")." };
      if (route.screen === "home") renderHome();
    }
  );
}

/* ---------------- login ---------------- */
function renderLogin() {
  app.innerHTML = "";
  const wrap = el("div", { style: { minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 32px", textAlign: "center" } }, [
    el("div", { html: ICONS.chef, style: { color: "var(--saffron)" } }),
    el("h1", { class: "display", style: { fontSize: "28px", margin: "16px 0 2px" } }, "La Tua Cucina"),
    el("p", { style: { fontSize: "13px", color: "var(--ink-soft)", marginBottom: "28px" } }, "Ricette, passo dopo passo"),
  ]);
  const box = el("div", { style: { width: "100%", maxWidth: "300px" } });
  const bn = bannerNode();
  if (bn) box.appendChild(bn);
  const btn = el("button", { class: "btn-primary" }, "Accedi con Google");
  btn.addEventListener("click", () => {
    banner = null;
    fauth.signInWithPopup(googleProvider).catch((e) => {
      if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
      console.error("popup sign-in failed", e);
      banner = { type: "error", text: "Accesso con Google non riuscito (" + e.code + ")." };
      renderCurrent();
    });
  });
  const note = el("p", { style: { fontSize: "11px", color: "var(--ink-soft)", marginTop: "12px", opacity: .75 } },
    "Resti connesso su questo dispositivo finché non esci.");
  box.append(btn, note);
  wrap.appendChild(box);
  app.appendChild(wrap);
}

/* ---------------- header ---------------- */
function header({ title, back, onBack, user, onLogout }) {
  const h = el("div", { class: "row", style: { justifyContent: "space-between", padding: "22px 20px 14px" } });
  if (back) {
    h.append(
      el("button", { class: "icon-btn", html: ICONS.back, onclick: onBack }),
      el("h2", { class: "display", style: { fontSize: "17px" } }, title || ""),
      el("div", { style: { width: "22px" } })
    );
  } else {
    h.append(
      el("div", {}, [
        el("p", { style: { fontSize: "12px", color: "var(--ink-soft)", margin: 0 } }, "Ciao, " + user),
        el("h1", { class: "display", style: { fontSize: "24px", margin: "2px 0 0" } }, title),
      ]),
      el("button", { class: "icon-btn", html: ICONS.logout, style: { color: "var(--ink-soft)" }, onclick: onLogout })
    );
  }
  return h;
}

function bannerNode() {
  if (!banner) return null;
  return el("div", { class: "banner " + banner.type }, [
    el("span", {}, banner.text),
    el("button", { style: { color: "var(--ink)", fontSize: "12px", textDecoration: "underline", flexShrink: 0 }, onclick: () => { banner = null; renderCurrent(); } }, "OK"),
  ]);
}

function renderCurrent() {
  if (route.screen === "home") renderHome();
  else if (route.screen === "detail") renderDetail();
  else if (route.screen === "create") renderCreate();
  else renderLogin();
}

/* ---------------- home ---------------- */
function recipeCard(r) {
  const cat = CATEGORIES.find((c) => c.key === r.category);
  const card = el("button", {
    class: "card", style: { display: "flex", width: "100%", textAlign: "left", marginBottom: "12px" },
    onclick: () => { route = { screen: "detail", selectedId: r.id }; render(); },
  });
  const thumb = el("div", { style: { width: "88px", height: "88px", flexShrink: 0, background: "var(--card-dim)", display: "flex", alignItems: "center", justifyContent: "center" } });
  if (r.coverImage) thumb.appendChild(el("img", { src: r.coverImage, style: { width: "100%", height: "100%", objectFit: "cover" } }));
  else thumb.innerHTML = ICONS.chef;
  const info = el("div", { style: { padding: "10px 14px", minWidth: 0, flex: 1 } }, [
    el("span", { style: { fontSize: "10.5px", color: "var(--herb)", letterSpacing: ".02em" } }, cat ? cat.label : ""),
    el("h3", { class: "display", style: { fontSize: "17px", margin: "2px 0 4px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, r.name),
    el("p", { style: { fontSize: "11.5px", color: "var(--ink-soft)", margin: 0 } }, (r.steps || []).length + " passaggi · " + r.author),
  ]);
  card.append(thumb, info);
  return card;
}

function renderHome() {
  app.innerHTML = "";
  app.appendChild(header({ title: "Le tue ricette", user: AUTH_USER, onLogout: () => {
    fauth.signOut();
  }}));
  const body = el("div", { style: { padding: "0 20px" } });
  const bn = bannerNode();
  if (bn) body.appendChild(bn);

  const chips = el("div", { class: "scroll-x", style: { marginBottom: "18px" } });
  const allChip = el("button", { class: "chip" + (filter === "all" ? " active" : "") }, "Tutte");
  allChip.addEventListener("click", () => { filter = "all"; renderHome(); });
  chips.appendChild(allChip);
  CATEGORIES.forEach((c) => {
    const chip = el("button", { class: "chip" + (filter === c.key ? " active" : "") }, c.label);
    chip.addEventListener("click", () => { filter = c.key; renderHome(); });
    chips.appendChild(chip);
  });
  body.appendChild(chips);

  const list = filter === "all" ? recipes : recipes.filter((r) => r.category === filter);
  if (list.length === 0) {
    body.appendChild(el("div", { style: { textAlign: "center", padding: "60px 0", color: "var(--ink-soft)" } }, [
      el("p", { style: { fontSize: "13px" } }, "Nessuna ricetta qui. Crea la prima."),
    ]));
  } else {
    list.forEach((r) => body.appendChild(recipeCard(r)));
  }
  app.appendChild(body);

  const fab = el("button", { class: "fab", html: ICONS.plus, onclick: () => {
    draft = { name: "", category: CATEGORIES[0].key, coverImage: null,
      ingredients: [""], steps: [{ id: rid(), text: "", hasTimer: false, minutes: "5", seconds: "0", image: null }] };
    route = { screen: "create", selectedId: null };
    render();
  }});
  app.appendChild(fab);
}

/* ---------------- create ---------------- */
function renderCreate() {
  app.innerHTML = "";
  app.appendChild(header({ title: "Nuova ricetta", back: true, onBack: () => { route = { screen: "home", selectedId: null }; render(); } }));
  const body = el("div", { style: { padding: "0 20px" } });

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "6px" } }, "Nome ricetta"));
  const nameInput = el("input", { class: "field", placeholder: "Es. Ragù della domenica", value: draft.name, style: { marginBottom: "16px" } });
  nameInput.addEventListener("input", (e) => { draft.name = e.target.value; updateSaveState(); });
  body.appendChild(nameInput);

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "8px" } }, "Categoria"));
  const catRow = el("div", { class: "scroll-x", style: { marginBottom: "18px" } });
  CATEGORIES.forEach((c) => {
    const chip = el("button", { class: "chip" + (draft.category === c.key ? " active" : "") }, c.label);
    chip.addEventListener("click", () => { draft.category = c.key; renderCreate(); });
    catRow.appendChild(chip);
  });
  body.appendChild(catRow);

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "8px" } }, "Foto di presentazione"));
  const coverLabel = el("label", { class: "card", style: { width: "100%", height: "140px", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", marginBottom: "22px", overflow: "hidden" } });
  if (draft.coverImage) coverLabel.appendChild(el("img", { src: draft.coverImage, style: { width: "100%", height: "100%", objectFit: "cover" } }));
  else coverLabel.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-soft)">' + ICONS.image + '<span style="font-size:12px">Carica foto</span></div>';
  const coverInput = el("input", { type: "file", accept: "image/*", style: { display: "none" } });
  coverInput.addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    pendingWork++;
    compressImage(file, 640, 0.6).then((dataUrl) => { draft.coverImage = dataUrl; pendingWork--; renderCreate(); })
      .catch((err) => { pendingWork--; console.error(err); });
  });
  coverLabel.appendChild(coverInput);
  body.appendChild(coverLabel);

  body.appendChild(el("label", { style: { fontSize: "11.5px", color: "var(--ink-soft)", display: "block", marginBottom: "8px" } }, "Ingredienti"));
  const ingList = el("div", { id: "ing-list", style: { marginBottom: "24px" } });
  body.appendChild(ingList);
  renderIngredients(ingList);

  body.appendChild(el("h3", { class: "display", style: { fontSize: "17px", marginBottom: "10px" } }, "Passaggi"));
  const stepsList = el("div", { id: "steps-list" });
  body.appendChild(stepsList);
  renderSteps(stepsList);

  const addStepBtn = el("button", { class: "btn-ghost", style: { marginBottom: "22px" } }, [
    el("span", { html: ICONS.plus }), " Aggiungi passaggio"
  ]);
  addStepBtn.addEventListener("click", () => {
    draft.steps.push({ id: rid(), text: "", hasTimer: false, minutes: "5", seconds: "0", image: null });
    renderSteps(stepsList);
  });
  body.appendChild(addStepBtn);

  const saveBtn = el("button", { class: "btn-primary", id: "save-btn" }, [el("span", { html: ICONS.check }), " Salva ricetta"]);
  saveBtn.addEventListener("click", saveRecipe);
  body.appendChild(saveBtn);
  body.appendChild(el("div", { style: { height: "20px" } }));

  app.appendChild(body);
  updateSaveState();
}

function renderIngredients(container) {
  container.innerHTML = "";
  draft.ingredients.forEach((val, idx) => {
    const row = el("div", { class: "row", style: { gap: "8px", marginBottom: "8px" } });
    const input = el("input", { class: "field", placeholder: "Es. 400g di pomodori pelati", value: val });
    input.addEventListener("input", (e) => { draft.ingredients[idx] = e.target.value; });
    row.appendChild(input);
    if (draft.ingredients.length > 1) {
      const rm = el("button", { class: "icon-btn", html: ICONS.trash, style: { color: "var(--ink-soft)" } });
      rm.addEventListener("click", () => { draft.ingredients.splice(idx, 1); renderIngredients(container); });
      row.appendChild(rm);
    }
    container.appendChild(row);
  });
  const addBtn = el("button", { class: "btn-ghost" }, [el("span", { html: ICONS.plus }), " Aggiungi ingrediente"]);
  addBtn.addEventListener("click", () => { draft.ingredients.push(""); renderIngredients(container); });
  container.appendChild(addBtn);
}

function renderSteps(container) {
  container.innerHTML = "";
  draft.steps.forEach((step, idx) => {
    const card = el("div", { class: "step-card" });
    const top = el("div", { class: "row", style: { justifyContent: "space-between", marginBottom: "8px" } }, [
      el("span", { style: { fontSize: "11.5px", fontWeight: 600, color: "var(--herb)" } }, "Passaggio " + (idx + 1)),
    ]);
    if (draft.steps.length > 1) {
      const rm = el("button", { html: ICONS.trash, style: { color: "var(--ink-soft)" } });
      rm.addEventListener("click", () => { draft.steps.splice(idx, 1); renderSteps(container); });
      top.appendChild(rm);
    }
    card.appendChild(top);

    const textArea = el("textarea", { class: "field", rows: "2", placeholder: "Descrivi cosa fare in questo passaggio...", style: { resize: "none", marginBottom: "10px" } });
    textArea.value = step.text;
    textArea.addEventListener("input", (e) => { step.text = e.target.value; updateSaveState(); });
    card.appendChild(textArea);

    const timerLabel = el("label", { class: "row", style: { gap: "8px", fontSize: "13.5px", marginBottom: "8px", cursor: "pointer" } });
    const cb = el("input", { type: "checkbox" });
    cb.checked = step.hasTimer;
    cb.addEventListener("change", (e) => { step.hasTimer = e.target.checked; renderSteps(container); });
    timerLabel.append(cb, "Aggiungi timer da cucina");
    card.appendChild(timerLabel);

    if (step.hasTimer) {
      const timeRow = el("div", { class: "row", style: { gap: "8px", marginBottom: "8px" } });
      const minInput = el("input", { class: "field", type: "text", inputmode: "numeric", style: { width: "60px", textAlign: "center", padding: "8px" }, value: step.minutes });
      minInput.addEventListener("input", (e) => { if (/^\d{0,3}$/.test(e.target.value)) step.minutes = e.target.value; else e.target.value = step.minutes; });
      minInput.addEventListener("blur", () => { step.minutes = String(Math.max(0, Math.min(180, parseInt(step.minutes, 10) || 0))); minInput.value = step.minutes; });
      const secInput = el("input", { class: "field", type: "text", inputmode: "numeric", style: { width: "60px", textAlign: "center", padding: "8px" }, value: step.seconds });
      secInput.addEventListener("input", (e) => { if (/^\d{0,2}$/.test(e.target.value)) step.seconds = e.target.value; else e.target.value = step.seconds; });
      secInput.addEventListener("blur", () => { step.seconds = String(Math.max(0, Math.min(59, parseInt(step.seconds, 10) || 0))); secInput.value = step.seconds; });
      timeRow.append(minInput, el("span", { style: { fontSize: "12px", color: "var(--ink-soft)" } }, "min"), secInput, el("span", { style: { fontSize: "12px", color: "var(--ink-soft)" } }, "sec"));
      card.appendChild(timeRow);
    }

    const photoLabel = el("label", { class: "row", style: { gap: "6px", fontSize: "12px", color: "var(--ink-soft)", cursor: "pointer" } });
    photoLabel.innerHTML = ICONS.image + '<span style="margin-left:4px">' + (step.image ? "Cambia foto" : "Aggiungi foto (opzionale)") + "</span>";
    const photoInput = el("input", { type: "file", accept: "image/*", style: { display: "none" } });
    photoInput.addEventListener("change", (e) => {
      const file = e.target.files[0]; if (!file) return;
      pendingWork++;
      compressImage(file, 480, 0.55).then((dataUrl) => { step.image = dataUrl; pendingWork--; renderSteps(container); })
        .catch((err) => { pendingWork--; console.error(err); });
    });
    photoLabel.appendChild(photoInput);
    card.appendChild(photoLabel);
    if (step.image) card.appendChild(el("img", { src: step.image, style: { width: "100%", height: "90px", objectFit: "cover", borderRadius: "8px", marginTop: "8px" } }));

    container.appendChild(card);
  });
}

function updateSaveState() {
  const btn = document.getElementById("save-btn");
  if (!btn) return;
  const ok = draft.name.trim() && draft.steps.every((s) => s.text.trim());
  btn.disabled = !ok;
}

function saveRecipe() {
  if (!draft.name.trim() || !draft.steps.every((s) => s.text.trim())) return;
  if (!currentUid) { banner = { type: "error", text: "Connessione al database non pronta, riprova tra un istante." }; renderCreate(); return; }
  const finish = () => {
    const data = {
      name: draft.name.trim(),
      category: draft.category,
      coverImage: draft.coverImage || null,
      ingredients: draft.ingredients.map((i) => i.trim()).filter(Boolean),
      steps: draft.steps.map((s) => ({
        id: s.id, text: s.text.trim(), hasTimer: s.hasTimer,
        minutes: parseInt(s.minutes, 10) || 0, seconds: parseInt(s.seconds, 10) || 0,
        image: s.image || null,
      })),
      author: AUTH_USER,
      authorUid: currentUid,
      createdAt: Date.now(),
    };
    const ref = fdb.collection("recipes").doc();
    ref.set(data).then(() => {
      route = { screen: "home", selectedId: null }; render();
    }).catch((e) => {
      console.error(e);
      const msg = e.code === "invalid-argument" || (e.message && e.message.indexOf("1048576") > -1)
        ? "Ricetta troppo grande (troppe foto o foto troppo pesanti): riduci il numero di foto."
        : "Salvataggio non riuscito: " + e.code;
      banner = { type: "error", text: msg };
      renderCreate();
    });
  };
  if (pendingWork > 0) {
    const btn = document.getElementById("save-btn");
    if (btn) { btn.disabled = true; }
    const wait = setInterval(() => { if (pendingWork === 0) { clearInterval(wait); finish(); } }, 150);
  } else {
    finish();
  }
}

/* ---------------- detail ---------------- */
function stepTimerBlock(step) {
  const total = step.minutes * 60 + step.seconds;
  if (!timers[step.id]) timers[step.id] = { remaining: total, running: false, ringing: false, total };
  const t = timers[step.id];
  const r = 22, circumference = 2 * Math.PI * r;

  const wrap = el("div", { class: "row", style: { gap: "10px", marginTop: "10px", background: "var(--card-dim)", borderRadius: "10px", padding: "10px 12px" } });
  const ringWrap = el("div", { class: t.ringing ? "ringing" : "", style: { position: "relative", width: "48px", height: "48px", flexShrink: 0 } });
  ringWrap.innerHTML =
    '<svg width="48" height="48" viewBox="0 0 48 48">' +
    '<circle cx="24" cy="24" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="4"/>' +
    '<circle class="timer-ring-progress" data-ring="' + step.id + '" cx="24" cy="24" r="' + r + '" fill="none" stroke="' + (t.ringing ? "var(--clay)" : "var(--herb)") + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + circumference + '" stroke-dashoffset="' + (circumference * (1 - (total > 0 ? t.remaining / total : 0))) + '" transform="rotate(-90 24 24)"/></svg>' +
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:' + (t.ringing ? "var(--clay)" : "var(--ink)") + '">' + ICONS.alarm + "</div>";

  const mm = String(Math.floor(t.remaining / 60)).padStart(2, "0");
  const ss = String(t.remaining % 60).padStart(2, "0");
  const info = el("div", { style: { flex: 1 } }, [
    el("p", { id: "time-" + step.id, style: { fontSize: "14px", fontWeight: 600, margin: 0 } }, t.ringing ? "Tempo scaduto!" : (mm + ":" + ss)),
    el("p", { id: "status-" + step.id, style: { fontSize: "10.5px", color: "var(--ink-soft)", margin: 0 } }, t.ringing ? "Tocca per fermare la sveglia" : (t.running ? "In corso" : "Timer pronto")),
  ]);

  const controls = el("div", { class: "row", style: { gap: "6px" } });
  if (t.ringing) {
    const stopBtn = el("button", { class: "icon-btn", html: ICONS.x, style: { background: "var(--clay)", color: "#fff" } });
    stopBtn.addEventListener("click", () => { stopAlarm(step.id); t.ringing = false; refreshTimerNode(step); });
    controls.appendChild(stopBtn);
  } else {
    const resetBtn = el("button", { class: "icon-btn", html: ICONS.reset, style: { background: "var(--card)", color: "var(--ink)" } });
    resetBtn.addEventListener("click", () => { t.remaining = total; t.running = false; refreshTimerNode(step); });
    const playBtn = el("button", { class: "icon-btn", html: t.running ? ICONS.pause : ICONS.play, style: { background: "var(--herb)", color: "#fff" } });
    playBtn.addEventListener("click", () => { t.running = !t.running; refreshTimerNode(step); });
    controls.append(resetBtn, playBtn);
  }

  wrap.append(ringWrap, info, controls);
  wrap.setAttribute("data-timer-wrap", step.id);
  return wrap;
}

function refreshTimerNode(step) {
  const old = document.querySelector('[data-timer-wrap="' + step.id + '"]');
  if (!old) return;
  const fresh = stepTimerBlock(step);
  old.replaceWith(fresh);
}

let tickInterval = null;
function startTicking() {
  if (tickInterval) return;
  tickInterval = setInterval(() => {
    if (route.screen !== "detail") return;
    const rec = recipes.find((r) => r.id === route.selectedId);
    if (!rec) return;
    rec.steps.forEach((step) => {
      const t = timers[step.id];
      if (t && t.running && t.remaining > 0) {
        t.remaining -= 1;
        if (t.remaining === 0) { t.running = false; t.ringing = true; startAlarm(step.id); }
        const timeEl = document.getElementById("time-" + step.id);
        const statusEl = document.getElementById("status-" + step.id);
        const ring = document.querySelector('[data-ring="' + step.id + '"]');
        if (t.ringing) {
          refreshTimerNode(step);
        } else if (timeEl && statusEl) {
          const mm = String(Math.floor(t.remaining / 60)).padStart(2, "0");
          const ss = String(t.remaining % 60).padStart(2, "0");
          timeEl.textContent = mm + ":" + ss;
          if (ring) {
            const c = 2 * Math.PI * 22;
            ring.setAttribute("stroke-dashoffset", c * (1 - (t.total > 0 ? t.remaining / t.total : 0)));
          }
        }
      }
    });
  }, 1000);
}

function renderDetail() {
  timers = {};
  startTicking();
  app.innerHTML = "";
  const rec = recipes.find((r) => r.id === route.selectedId);
  if (!rec) {
    app.appendChild(el("div", { style: { minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "0 30px", textAlign: "center" } }, [
      el("p", { style: { fontSize: "13px", marginBottom: "16px" } }, "Ricetta non trovata."),
      (() => { const b = el("button", { class: "btn-primary", style: { width: "auto", padding: "10px 20px" } }, "Torna alle ricette"); b.addEventListener("click", () => { route = { screen: "home", selectedId: null }; render(); }); return b; })(),
    ]));
    return;
  }
  app.appendChild(header({ title: "", back: true, onBack: () => { route = { screen: "home", selectedId: null }; render(); } }));
  const body = el("div", { style: { padding: "0 20px" } });

  const cover = el("div", { class: "card", style: { width: "100%", height: "190px", marginBottom: "16px", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--card-dim)" } });
  if (rec.coverImage) cover.appendChild(el("img", { src: rec.coverImage, style: { width: "100%", height: "100%", objectFit: "cover" } }));
  else cover.innerHTML = ICONS.chef;
  body.appendChild(cover);

  const cat = CATEGORIES.find((c) => c.key === rec.category);
  body.appendChild(el("span", { style: { fontSize: "11px", color: "var(--saffron)" } }, cat ? cat.label : ""));

  const titleRow = el("div", { class: "row", style: { justifyContent: "space-between", alignItems: "flex-start" } });
  titleRow.appendChild(el("h1", { class: "display", style: { fontSize: "23px", margin: "2px 0 2px" } }, rec.name));
  if (rec.authorUid && rec.authorUid === currentUid) {
    let confirming = false, confirmTimeout = null;
    const del = el("button", { class: "icon-btn", html: ICONS.trash, style: { color: "var(--ink-soft)", marginTop: "4px" } });
    del.addEventListener("click", () => {
      if (!confirming) {
        confirming = true;
        del.innerHTML = ICONS.check;
        del.style.color = "var(--clay)";
        confirmTimeout = setTimeout(() => { confirming = false; del.innerHTML = ICONS.trash; del.style.color = "var(--ink-soft)"; }, 3000);
        return;
      }
      clearTimeout(confirmTimeout);
      fdb.collection("recipes").doc(rec.id).delete().catch((e) => console.error(e));
      recipes = recipes.filter((r) => r.id !== rec.id);
      route = { screen: "home", selectedId: null }; render();
    });
    titleRow.appendChild(del);
  }
  body.appendChild(titleRow);
  body.appendChild(el("p", { style: { fontSize: "11.5px", color: "var(--ink-soft)", margin: "0 0 18px" } }, "di " + rec.author));

  if (rec.ingredients && rec.ingredients.length) {
    const box = el("div", { class: "card", style: { padding: "14px 16px", marginBottom: "22px" } });
    box.appendChild(el("h3", { class: "display", style: { fontSize: "15px", margin: "0 0 8px" } }, "Ingredienti"));
    const ul = el("ul", { style: { margin: 0, padding: 0, listStyle: "none" } });
    rec.ingredients.forEach((ing) => {
      ul.appendChild(el("li", { class: "row", style: { gap: "8px", fontSize: "13.5px", padding: "3px 0" } }, [
        el("span", { style: { width: "4px", height: "4px", borderRadius: "999px", background: "var(--herb)", flexShrink: 0 } }),
        ing,
      ]));
    });
    box.appendChild(ul);
    body.appendChild(box);
  }

  rec.steps.forEach((step, idx) => {
    const stepWrap = el("div", { style: { marginBottom: "16px", paddingBottom: "16px", borderBottom: idx < rec.steps.length - 1 ? "1px solid var(--line)" : "none" } });
    const inner = el("div", { class: "row", style: { alignItems: "flex-start", gap: "12px" } });
    inner.appendChild(el("div", { class: "display", style: { width: "26px", height: "26px", borderRadius: "999px", background: "var(--card-dim)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "12px", flexShrink: 0 } }, String(idx + 1)));
    const right = el("div", { style: { flex: 1, minWidth: 0 } });
    right.appendChild(el("p", { style: { fontSize: "14px", lineHeight: "1.5", margin: 0 } }, step.text));
    if (step.image) right.appendChild(el("img", { src: step.image, style: { width: "100%", height: "150px", objectFit: "cover", borderRadius: "10px", marginTop: "10px" } }));
    if (step.hasTimer) right.appendChild(stepTimerBlock(step));
    inner.appendChild(right);
    stepWrap.appendChild(inner);
    body.appendChild(stepWrap);
  });

  app.appendChild(body);
}

/* ---------------- boot ---------------- */
function render() {
  if (route.screen === "login") renderLogin();
  else if (route.screen === "create") renderCreate();
  else if (route.screen === "detail") renderDetail();
  else renderHome();
}
render();
initFirebase();
</script>
</body>
</html>
